<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>こつこつ</title>
<meta name="description" content="貯金の目標と、貯まっていく様子がひと目でわかる自分用アプリ">
<meta name="theme-color" content="#1f3a34">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="こつこつ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* 1カラム。上に合計、その下に目標カード。記録は右下の「＋」から。データは端末内（localStorage）に保存 */
:root{
  --bg:#f1f3f0; --surface:#ffffff; --ink:#1c2b27; --sub:#5d6b66; --line:#d9dfdb;
  --acc:#1f6f5c; --accink:#ffffff; --accsoft:#e2efea;
  --in:#1f6f5c; --out:#b4452f; --done:#c08a00;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;
  color-scheme:light
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#18211e; --ink:#e6ece9; --sub:#9aa8a2; --line:#2a3632;
  --acc:#4fbf9f; --accink:#0f1513; --accsoft:#1d302a; --in:#4fbf9f; --out:#f08a72; --done:#e9b84c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#18211e; --ink:#e6ece9; --sub:#9aa8a2; --line:#2a3632;
  --acc:#4fbf9f; --accink:#0f1513; --accsoft:#1d302a; --in:#4fbf9f; --out:#f08a72; --done:#e9b84c; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body);
  padding:max(12px,env(safe-area-inset-top,0px)) 16px calc(84px + env(safe-area-inset-bottom,0px))}
main{max-width:520px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
h1{font-size:15px;margin:0 0 10px;color:var(--sub);font-weight:700;display:flex;justify-content:space-between}
h2{font-size:14px;color:var(--sub);margin:18px 0 8px;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}

/* 合計 */
.total .big{font-size:34px;font-weight:700;line-height:1.2}
.total .row{display:flex;gap:16px;color:var(--sub);font-size:14px;margin-top:4px}
.plus{color:var(--in)} .minus{color:var(--out)}

/* 目標カード */
.goal{display:block;width:100%;text-align:left;border:1px solid var(--line)}
.goal .top{display:flex;align-items:center;gap:10px}
.goal .ic{font-size:22px;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--accsoft);flex:none}
.goal .name{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goal .pct{font-weight:700}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--c,var(--acc))}
.goal .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);gap:8px}
.btn.ai{width:100%;margin-top:12px;background:var(--accsoft);border-color:transparent;color:var(--ink)}
/* お知らせ（起きたときだけ） */
.note{display:flex;align-items:center;gap:8px;background:var(--accsoft);border-radius:12px;padding:8px 6px 8px 12px;margin-bottom:8px;font-size:14px;line-height:1.5}
.note>span{flex:1;min-width:0}
.nb{border:0;background:var(--acc);color:var(--accink);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:700;flex:none}
.hd{display:flex;align-items:center;gap:2px}.eye{font-size:16px}
body.hide main .num,body.hide main .chart text{filter:blur(7px)}
/* 予算の色 */
.bar.lv-ok i{background:var(--acc)}.bar.lv-warn i{background:var(--done)}.bar.lv-over i{background:var(--out)}
.lvt-warn{color:var(--done)}.lvt-over{color:var(--out)}
.cb{font-size:11px;color:var(--sub);font-weight:400}
.rec summary{display:flex;justify-content:space-between;gap:8px;cursor:pointer;font-size:14px;list-style:none}
.rec summary::-webkit-details-marker{display:none}
.bcats{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}.bcats label{margin:6px 0 0}
.chk{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14px}.chk input{width:auto;margin:0}
.frame{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.fr{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--sub);padding:2px 0}.fr b{color:var(--ink)}
.simres{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0 6px}
.simres div{background:var(--bg);border-radius:10px;padding:6px 10px;min-width:0}.simres small{display:block;font-size:11px;color:var(--sub)}.simres b{font-size:15px}
.simres div:first-child{grid-column:1/-1}.simres div:first-child b{font-size:24px}
.guide summary{cursor:pointer;font-weight:700;font-size:14px}
.guide ol{padding-left:1.3em;margin:8px 0;font-size:14px}.guide li{margin-bottom:6px}
.guide code{background:var(--bg);border-radius:4px;padding:0 4px;font-size:13px}
.mon{display:flex;align-items:center;gap:4px;color:var(--ink)}
.mon .x{font-size:20px;color:var(--acc)} .mon .x:disabled{opacity:.3}
.cat{display:grid;grid-template-columns:7.5em 1fr auto;align-items:center;gap:8px;font-size:14px;padding:3px 0}
.cbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.cbar i{display:block;height:100%;border-radius:4px}
.list li.day{font-size:12px;color:var(--sub);font-weight:700;padding:10px 0 2px;border-bottom:0}
.tag{font-size:11px;font-weight:700;color:var(--sub);border:1px solid var(--line);border-radius:6px;padding:0 6px}
/* お祝い（紙吹雪） */
.cele{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);overflow:hidden}
.cele .box{background:var(--surface);border-radius:20px;padding:22px 24px;text-align:center;max-width:300px;margin:0 16px;animation:pop .35s ease-out;position:relative;z-index:2}
.cele .em{font-size:48px;line-height:1.1}.cele h3{margin:8px 0 4px;font-size:19px}.cele p{margin:4px 0;color:var(--sub);font-size:14px;line-height:1.6}
.cele i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall 1.9s ease-in forwards;z-index:1}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.cele i{display:none}.cele .box{animation:none}}
.why{font-size:12.5px;color:var(--sub);margin-top:6px;font-style:italic}
.future{font-size:13px;color:var(--sub);margin-top:6px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.badges div{border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;font-size:11.5px;line-height:1.35}
.badges div b{display:block;font-size:26px;margin-bottom:2px}
.badges div.no{opacity:.35;filter:grayscale(1)}
.badge{font-size:12px;font-weight:700;color:var(--done);border:1px solid var(--done);border-radius:999px;padding:0 8px}
.empty{color:var(--sub);text-align:center;padding:28px 8px}

/* 詳細 */
.back{background:none;border:0;color:var(--acc);padding:4px 0;margin-bottom:6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.stats div{background:var(--bg);border-radius:10px;padding:8px 10px}
.stats small{display:block;color:var(--sub);font-size:12px}
.stats b{font-size:17px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .d{color:var(--sub);font-size:13px;width:48px;flex:none}
.list .m{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .a{font-weight:700}
.x{background:none;border:0;color:var(--sub);padding:2px 6px;font-size:18px;line-height:1}
.btns{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;font-weight:700}
.btn.pri{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.btn.warn{color:var(--out)}

/* グラフ */
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--sub);font-size:11px;font-family:var(--f-body)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--sub);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:5px;vertical-align:-1px}

/* 下のタブ */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs button{flex:1;max-width:173px;background:none;border:0;padding:10px 0 12px;color:var(--sub);font-size:13px;font-weight:700}
nav.tabs button[aria-current="page"]{color:var(--acc)}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:6;
  width:56px;height:56px;border-radius:50%;border:0;background:var(--acc);color:var(--accink);font-size:30px;line-height:1;
  box-shadow:0 4px 14px rgba(0,0,0,.18)}

/* 入力シート */
.sheet{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet form{background:var(--surface);width:100%;max-width:520px;border-radius:18px 18px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 10px;font-size:16px}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px}
.amount{font-size:28px;font-weight:700;text-align:right}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--bg);padding:8px;font-weight:700;color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--accink)}
.seg button.out[aria-pressed="true"]{background:var(--out);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:14px}
.chips button[aria-pressed="true"]{border-color:var(--acc);background:var(--accsoft);color:var(--ink);font-weight:700}
.quick{display:flex;gap:6px;margin-top:6px}
.quick button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 0;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.icons button{font-size:20px;padding:4px 8px}
.colors button{width:30px;height:30px;padding:0;border-radius:50%;background:var(--c)}
.colors button[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.hint{font-size:13px;color:var(--sub);margin:6px 0 0}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;
  background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;white-space:nowrap}
</style>
</head>
<body>
<main id="app"></main>
<button class="fab" id="fab" aria-label="記録する">＋</button>
<nav class="tabs">
  <button data-tab="home">ホーム</button>
  <button data-tab="spend">出費</button>
  <button data-tab="chart">グラフ</button>
  <button data-tab="settings">設定</button>
</nav>
<div class="sheet" id="sheet" hidden></div>
<input type="file" id="payfile" accept=".txt,text/plain" hidden>
<input type="file" id="restorefile" accept=".json,application/json" hidden>
<div class="toast" id="toast" hidden></div>
<div class="cele" id="cele" hidden></div>

<script>
'use strict';
const KEY='kotsukotsu-v1';
const ICONS=['💰','✈️','🏠','🚗','💻','🎓','🎁','📷','🎮','🏝️','💍','🩺'];
const COLORS=['#1f6f5c','#2f6db5','#b4452f','#c08a00','#7a4fb0','#3a8f9e'];
const $=s=>document.querySelector(s);
const yen=n=>'¥'+Math.round(n).toLocaleString('ja-JP');
const sgn=n=>(n>0?'+':n<0?'−':'')+yen(Math.abs(n));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const md=s=>{const[,m,d]=s.split('-');return (+m)+'/'+(+d)};

/* ---------- 保存 ---------- */
let S=load();
function load(){
  let s=null;
  try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!s||!s.goals)s={v:1,goals:[],tx:[],theme:'auto'};
  return fill(s);
}
/* 出費まわりの項目がない古いデータにも足す */
function fill(s){
  s.spend=s.spend||[];s.rules=s.rules||{};s.seen=s.seen||{};
  s.budget=s.budget||{total:0,cats:{}};s.fixed=s.fixed||[];s.dismiss=s.dismiss||{};
  /* 銀行口座の残高（手で入れる）。最初はゆうちょと三菱UFJ */
  if(!s.accounts)s.accounts=[{id:'yucho',name:'ゆうちょ銀行',icon:'📮',bal:null,at:null,hist:[]},{id:'mufg',name:'三菱UFJ銀行',icon:'🏦',bal:null,at:null,hist:[]}];
  return s;
}

/* ---------- 出費 ---------- */
const CATS=[['食費','🍙'],['カフェ','☕'],['コンビニ','🏪'],['交通','🚃'],['買い物','🛍️'],['日用品','🧴'],['娯楽','🎬'],['サブスク','🔁'],['その他','📦']];
const CAT_ICON=Object.fromEntries(CATS);
const CAT_COLOR={'食費':'#1f6f5c','カフェ':'#8a5a3c','コンビニ':'#2f6db5','交通':'#3a8f9e','買い物':'#b4452f','日用品':'#7a4fb0','娯楽':'#c08a00','サブスク':'#5d6b66','その他':'#9aa8a2'};
/* 店名から分類する。自分で直した分類（S.rules）を先に使う */
const AUTO_RULES=[
  ['コンビニ',/セブン|ｾﾌﾞﾝ|7-?ELEVEN|ローソン|LAWSON|ファミリーマート|ファミマ|FAMILYMART|ミニストップ|デイリーヤマザキ/i],
  ['カフェ',/スターバックス|STARBUCKS|ドトール|DOUTOR|タリーズ|TULLY|コメダ|エクセルシオール|ブルーボトル|カフェ|CAFE|COFFEE/i],
  ['交通',/^JR|ＪＲ|SUICA|ICOCA|PASMO|モバイルSuica|阪急|阪神|京阪|近鉄|南海|メトロ|METRO|地下鉄|タクシー|TAXI|^GO$|バス/i],
  ['サブスク',/APPLE\.COM|ITUNES|SPOTIFY|NETFLIX|AMAZON PRIME|プライム|YOUTUBE|DISNEY|ADOBE|CHATGPT|OPENAI|ANTHROPIC|CLAUDE/i],
  ['食費',/マクドナルド|MCDONALD|吉野家|すき家|松屋|サイゼリヤ|ガスト|スシロー|くら寿司|はま寿司|モスバーガー|ケンタッキー|KFC|丸亀|餃子の王将|CoCo壱|スーパー|ライフ|イオン|AEON|業務スーパー|万代|コープ|成城石井/i],
  ['日用品',/マツモトキヨシ|マツキヨ|スギ薬局|ココカラ|ダイソー|DAISO|セリア|キャンドゥ|ドラッグ|薬局|ツルハ|ウエルシア/i],
  ['買い物',/AMAZON|アマゾン|楽天|RAKUTEN|ユニクロ|UNIQLO|^GU$|ジーユー|無印|MUJI|ZARA|ヨドバシ|ビックカメラ|ロフト|LOFT|ハンズ|ZOZO/i],
  ['娯楽',/映画|シネマ|CINEMA|TOHO|イオンシネマ|カラオケ|ラウンドワン|ROUND1|チケット|TICKET|ゲーム|NINTENDO|PLAYSTATION|STEAM/i]
];
function guessCat(m){
  if(S.rules[m])return S.rules[m];
  for(const[c,re]of AUTO_RULES)if(re.test(m))return c;
  return 'その他';
}
const spendIn=k=>S.spend.filter(x=>ym(x.date)===k);
const spendTotal=k=>spendIn(k).reduce((a,x)=>a+x.amount,0);
function byCat(k){const o={};for(const x of spendIn(k))o[x.cat]=(o[x.cat]||0)+x.amount;return Object.entries(o).sort((a,b)=>b[1]-a[1])}
const prevYM=k=>{const[y,m]=k.split('-').map(Number);const d=new Date(y,m-2,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const daysInMonth=k=>{const[y,m]=k.split('-').map(Number);return new Date(y,m,0).getDate()};
/* 予算の使い方で色を決める：〜80% ふつう、〜100% 注意、超え 赤 */
const level=(used,b)=>!b?'':used>b?'over':used>b*.8?'warn':'ok';

/* 毎月同じ店・ほぼ同じ金額の支払い（サブスク・固定費）を見つける。直近4か月で2か月以上、金額の差が15%以内 */
function recurring(){
  const since=(()=>{let k=curYM();for(let i=0;i<3;i++)k=prevYM(k);return k})();
  const by={};
  for(const x of S.spend){if(x.src==='fixed'||ym(x.date)<since)continue;(by[x.merchant]=by[x.merchant]||[]).push(x)}
  const out=[];
  for(const[m,xs]of Object.entries(by)){
    const months=new Set(xs.map(x=>ym(x.date)));if(months.size<2)continue;
    if(xs.length>months.size)continue; /* 月に2回以上ある店（スーパーなど）は除く */
    const per={};for(const x of xs)per[ym(x.date)]=(per[ym(x.date)]||0)+x.amount;
    const v=Object.values(per),lo=Math.min(...v),hi=Math.max(...v);
    if(hi>lo*1.15)continue;
    const last=xs.sort((a,b)=>b.date.localeCompare(a.date))[0];
    out.push({name:m,amount:per[ym(last.date)],cat:last.cat,auto:true});
  }
  for(const f of S.fixed)out.push({name:f.name,amount:f.amount,cat:f.cat,auto:false,day:f.day});
  return out.sort((a,b)=>b.amount-a.amount);
}
/* ふだんの1か月の出費（直近3か月のうち記録がある月の平均） */
function avgSpend(){
  let k=curYM(),v=[];for(let i=0;i<3;i++){k=prevYM(k);const t=spendTotal(k);if(t)v.push(t)}
  return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null;
}
/* 貯金がプラスだった月が何か月続いているか（今月がプラスなら今月から数える） */
function streak(){
  let k=monthNet(curYM())>0?curYM():prevYM(curYM()),n=0;
  while(monthNet(k)>0&&n<120){n++;k=prevYM(k)}
  return n;
}

/* ---------- やる気：お祝い・実績・未来の自分・ガマン貯金・出費ゼロの日 ---------- */
/* 直近3か月の平均の増え方（マイナスは0） */
function pace(){let k=curYM(),s=0;for(let i=0;i<3;i++){k=prevYM(k);s+=monthNet(k)}return Math.max(0,s/3)}
/* 出費ゼロの日（今月、昨日まで。固定費は数えない） */
function noSpendDays(){
  if(!S.spend.some(x=>x.src==='applepay'))return null;
  const cur=curYM(),d=+today().slice(8),used=new Set(S.spend.filter(x=>ym(x.date)===cur&&x.src!=='fixed').map(x=>+x.date.slice(8)));
  let n=0;for(let i=1;i<d;i++)if(!used.has(i))n++;return n;
}

}

/* ショートカットが書いたファイルを読む。1行＝「日時<TAB>店名<TAB>金額<TAB>カード」。同じ行は二度入れない */
function parsePayLog(text){
  const out=[];
  for(const raw of text.split(/\r?\n/)){
    const line=raw.trim();if(!line)continue;
    const p=line.split('\t');if(p.length<3||p[1].trim()==='残高')continue;
    const dm=p[0].match(/(\d{4})[-\/年.](\d{1,2})[-\/月.](\d{1,2})/);if(!dm)continue;
    const date=dm[1]+'-'+dm[2].padStart(2,'0')+'-'+dm[3].padStart(2,'0');
    const tm=p[0].match(/(\d{1,2}):(\d{2})/),time=tm?tm[1].padStart(2,'0')+':'+tm[2]:'';
    const merchant=p[1].trim()||'（店名なし）';
    const amount=Math.round(parseFloat(p[2].replace(/[^0-9.]/g,'')));
    if(!amount)continue;
    out.push({key:line,date,time,merchant,amount,card:(p[3]||'').trim()});
  }
  return out;
}
function importPayLog(text){

const ACCT_KW={yucho:/ゆうちょ|ゆうちよ|郵便|JP\s?BANK/i,mufg:/三菱|MUFG|UFJ/i};
function acctOf(t){
  for(const a of S.accounts){const kw=ACCT_KW[a.id]||new RegExp(a.name.replace(/銀行$/,'').replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i');if(kw.test(t))return a.id}
  return null;
}
function readAmount(t){
  t=t.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[，､]/g,',').replace(/￥/g,'¥');
  const re=/[¥]\s*(\d{1,3}(?:,\d{3})+|\d+)|(\d{1,3}(?:,\d{3})+|\d+)\s*円/g,c=[];let m;
  while((m=re.exec(t)))c.push({i:m.index,v:+(m[1]||m[2]).replace(/,/g,'')});
  if(!c.length)return null;
  const k=t.search(/残高|お預り|預金|お預かり/);
  const after=k>=0?c.find(x=>x.i>k):null;
  return (after||c.reduce((a,b)=>b.v>a.v?b:a)).v;
}
function parseBalLog(text){
  const out=[];
  for(const raw of text.split(/\r?\n/)){
    const p=raw.trim().split('\t');if(p.length<3||p[1].trim()!=='残高')continue;
    const dm=p[0].match(/(\d{4})[-\/年.](\d{1,2})[-\/月.](\d{1,2})/);if(!dm)continue;
    const body=p.slice(2).join(' ');
    out.push({key:raw.trim(),date:dm[1]+'-'+dm[2].padStart(2,'0')+'-'+dm[3].padStart(2,'0'),acct:acctOf(body),v:readAmount(body)});
  }
  return out;
}

function daysLeft(deadline){
  if(!deadline)return null;
  const a=new Date(today()+'T00:00'),b=new Date(deadline+'T00:00');
  return Math.round((b-a)/864e5);
}
/* 期限に間に合うための月あたりの額（100円単位で切り上げ） */
function perMonth(g){
  const rest=g.target-current(g),d=daysLeft(g.deadline);
  if(rest<=0||d==null)return null;
  if(d<=0)return {late:true,rest};
  const months=Math.max(1,d/30.44);
  return {late:false,amount:Math.ceil(rest/months/100)*100,rest};
}
/* 直近3か月の入金ペースから、達成見込みの月を出す */
function forecast(g){
  const rest=g.target-current(g);if(rest<=0)return null;
  const now=new Date(),keys=[];
  for(let i=1;i<=3;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1);keys.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'))}
  const pace=S.tx.filter(t=>t.goalId===g.id&&keys.includes(ym(t.date))).reduce((a,t)=>a+t.amount,0)/3;
  if(pace<=0)return null;
  const d=new Date(now.getFullYear(),now.getMonth()+Math.ceil(rest/pace),1);
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月ごろ';
}

function runAuto(){
  let n=0;const t=today();
  for(const g of S.goals){

    let k=g.auto.last?nextYM(g.auto.last):curYM();

      f.last=k;m++;k=nextYM(k);

/* お知らせ：起きたときだけ、ホームの上に1行ずつ（最大3つ）。×で今月は出さない */
function noticesHTML(){
  const cur=curYM(),day=+today().slice(8),N=[],off=k=>S.dismiss[k];
  const note=(key,text,btn)=>N.push(`<div class="note"><span>${text}</span>${btn||''}<button class="x" data-dismiss="${key}" aria-label="閉じる">×</button></div>`);
  const stP=monthNet(prevYM(cur))>0?streak():0;
  if(day>=20&&stP>=1&&monthNet(cur)<=0&&!off('st:'+cur))note('st:'+cur,`今月はまだプラスになっていません。🔥${stP}か月連続を守りましょう（あと${daysInMonth(cur)-day+1}日）`,'<button class="nb" data-addtx>記録</button>');
  if(S.payday&&day>=S.payday&&!off('pay:'+cur))note('pay:'+cur,'給料日です。先取り貯金はしましたか？','<button class="nb" data-addany>記録</button>');
  const pv=prevYM(cur);
  if(day<=7&&!off('rev:'+cur)&&(monthNet(pv)||spendTotal(pv))){
    const pp=prevYM(pv),dn=monthNet(pv)-monthNet(pp),ds=spendTotal(pv)-spendTotal(pp);
    note('rev:'+cur,`${+pv.slice(5)}月のふり返り：貯金 <b class="num">${sgn(monthNet(pv))}</b>（前月比 ${sgn(dn)}）${spendTotal(pv)?`・出費 <b class="num">${yen(spendTotal(pv))}</b>（${sgn(ds)}）`:''}`);
  }
  for(const g of activeGoals()){
    if(g.kind!=='invest'||!S.tx.some(t=>t.goalId===g.id))continue;
    const old=!g.valueDate||(new Date(today())-new Date(g.valueDate))/864e5>30;
    if(old&&!off('val:'+g.id+':'+cur))note('val:'+g.id+':'+cur,`「${esc(g.name)}」の評価額を更新しましょう${g.valueDate?'（前回 '+md(g.valueDate)+'）':''}`,`<button class="nb" data-value="${g.id}">更新</button>`);

  const oldAc=S.accounts.filter(x=>x.bal!=null&&(new Date(today())-new Date(x.at))/864e5>30);
  if(oldAc.length&&!off('bank:'+cur))note('bank:'+cur,`口座の残高を更新しましょう（${oldAc.map(x=>esc(x.name.replace(/銀行$/,''))+' '+md(x.at)).join('、')}）`,'<button class="nb" data-bankall>更新</button>');
  const bkOld=!S.backupAt||(new Date(today())-new Date(S.backupAt))/864e5>30;
  if(bkOld&&S.tx.length+S.spend.length>=5&&!off('bk:'+cur))note('bk:'+cur,`バックアップをファイルに保存しましょう（前回：${S.backupAt?md(S.backupAt):'なし'}）`,'<button class="nb" data-backup>保存</button>');
  return N.slice(0,3).join('');
}

/* シミュレーターの入力（はじめは積み立て目標の合計から） */
const invGoals=()=>activeGoals().filter(g=>g.kind==='invest');
let sim={m:invGoals().reduce((a,g)=>a+(g.auto?.amount||0),0)||30000,i:invGoals().reduce((a,g)=>a+current(g),0),y:20,r:3};
function simOut(){
  const rows=simulate(sim.i,sim.m,Math.min(50,Math.max(1,sim.y)),sim.r);if(!rows.length)return '';
  const last=rows.at(-1),gain=last.v-last.p,mx=niceMax(last.v);
  const pick=rows.filter(r=>r.y%5===0||r.y===rows.length).slice(-10);
  const W=320,H=120,bw=W/pick.length;
  let svg=`<svg viewBox="0 0 ${W} ${H+18}" role="img" aria-label="積立の将来額">`;
  pick.forEach((r,i)=>{const hp=r.p/mx*H,hv=(r.v-r.p)/mx*H,x=i*bw+bw*.2,w=bw*.6;
    svg+=`<rect x="${x}" y="${H-hp}" width="${w}" height="${hp}" fill="var(--acc)" opacity=".45" rx="1.5"/><rect x="${x}" y="${H-hp-Math.max(0,hv)}" width="${w}" height="${Math.max(0,hv)}" fill="var(--acc)" rx="1.5"/><text x="${x+w/2}" y="${H+14}" text-anchor="middle">${r.y}年</text>`});
  svg+='</svg>';
  return `<div class="simres"><div><small>${rows.length}年後</small><b class="num">${yen(last.v)}</b></div><div><small>入れた額</small><b class="num">${yen(last.p)}</b></div><div><small>増えた分</small><b class="num ${gain>=0?'plus':'minus'}">${sgn(gain)}</b></div></div>
   <div class="chart">${svg}</div><div class="legend"><span style="--c:color-mix(in srgb,var(--acc) 45%,transparent)">入れた額</span><span style="--c:var(--acc)">増えた分</span></div>`;
}
/* 生活防衛資金の目安：ふだんの1か月の出費 × 3〜6か月 */
function defenseHTML(){
  const avg=avgSpend();if(!avg)return '';
  const em=activeGoals().filter(g=>g.emergency),src=em.length?em:activeGoals().filter(g=>g.kind!=='invest');
  const have=src.reduce((a,g)=>a+current(g),0),lo=avg*3,hi=avg*6;
  const msg=have>=hi?'6か月分あります。安心な水準です':have>=lo?'3か月分はあります。6か月分あるとさらに安心です':`3か月分まで あと ${yen(lo-have)}`;
  return `<h2>生活防衛資金の目安</h2><section class="card">
   <div class="fr"><span>ふだんの1か月の出費（直近の平均）</span><b class="num">${yen(avg)}</b></div>
   <div class="fr"><span>目安（3〜6か月分）</span><b class="num">${yen(lo)} 〜 ${yen(hi)}</b></div>
   <div class="fr"><span>${em.length?'緊急用の目標':'貯金（積み立て以外）'}</span><b class="num">${yen(have)}</b></div>
   <div class="bar"><i style="width:${Math.min(100,have/hi*100)}%"></i></div>
   <p class="hint" style="margin-top:2px">${msg}。出費は記録した分だけで計算しているので、家賃など記録していない支払いがあれば実際はもっと多めです。</p></section>`;
}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));for(const k of[1,2,2.5,5,10])if(k*p>=v)return k*p;return 10*p}
function short(v){return v>=10000?(v/10000).toLocaleString('ja-JP',{maximumFractionDigits:1})+'万':Math.round(v).toLocaleString('ja-JP')}

/* ---------- 入力シート ---------- */
function openSheet(html){const s=$('#sheet');s.innerHTML=html;s.hidden=false}
function closeSheet(){$('#sheet').hidden=true;$('#sheet').innerHTML=''}

function txSheet(gid,preset,memo){
  const gs=activeGoals();
  if(!gs.length)return goalSheet();
  let sel=gid||gs[0].id,sign=1;
  setTimeout(()=>{if(preset&&$('#amt'))$('#amt').value=(+preset).toLocaleString('ja-JP');if(memo&&$('#memo'))$('#memo').value=memo},0);
  openSheet(`<form id="txf"><h3>記録する</h3>
   <div class="seg"><button type="button" data-sign="1" aria-pressed="true">入金</button><button type="button" class="out" data-sign="-1" aria-pressed="false">出金</button></div>
   <label for="amt">金額</label><input id="amt" class="amount num" inputmode="numeric" pattern="[0-9,]*" placeholder="0" autocomplete="off" required>
   <div class="quick">${[1000,5000,10000,30000].map(v=>`<button type="button" data-q="${v}">+${short(v)}</button>`).join('')}</div>
   <label>目標</label><div class="chips">${gs.map(g=>`<button type="button" data-g="${g.id}" aria-pressed="${g.id===sel}">${g.icon} ${esc(g.name)}</button>`).join('')}</div>
   <div class="two"><div><label for="dt">日付</label><input id="dt" type="date" value="${today()}" required></div>
   <div><label for="memo">メモ</label><input id="memo" placeholder="例：給料から" maxlength="40"></div></div>
   <div class="btns"><button type="button" class="btn" data-close>やめる</button><button class="btn pri">記録する</button></div></form>`);
  const f=$('#txf'),amt=$('#amt');
  setTimeout(()=>amt.focus(),50);
  amt.addEventListener('input',()=>{const n=amt.value.replace(/[^0-9]/g,'');amt.value=n?(+n).toLocaleString('ja-JP'):''});
  f.addEventListener('click',e=>{
    const t=e.target.closest('button');if(!t)return;
    if(t.dataset.sign){sign=+t.dataset.sign;f.querySelectorAll('[data-sign]').forEach(b=>b.setAttribute('aria-pressed',b===t))}
    if(t.dataset.g){sel=t.dataset.g;f.querySelectorAll('[data-g]').forEach(b=>b.setAttribute('aria-pressed',b===t))}
    if(t.dataset.q){const n=(+amt.value.replace(/[^0-9]/g,'')||0)+(+t.dataset.q);amt.value=n.toLocaleString('ja-JP')}
  });
  f.addEventListener('submit',e=>{
    e.preventDefault();
    const n=+amt.value.replace(/[^0-9]/g,'');if(!n){amt.focus();return}
    const g=S.goals.find(x=>x.id===sel),before=current(g),tb=totalAll();
    S.tx.push({id:uid(),goalId:sel,amount:sign*n,date:$('#dt').value||today(),memo:$('#memo').value.trim()});
    save();closeSheet();render();
    if(sign>0)cheer(g,before,current(g),tb,n);else toast(`${yen(n)} 出金しました`);
  });
}

function goalSheet(id){
  const g=id?S.goals.find(x=>x.id===id):{name:'',target:'',deadline:'',icon:ICONS[0],color:COLORS[S.goals.length%COLORS.length]};
  let icon=g.icon,color=g.color,kind=g.kind||'save';
  const au=g.auto||{amount:0,day:25};
  openSheet(`<form id="gf"><h3>${id?'目標を編集':'目標を作る'}</h3>
   ${id?'':`<label style="margin-top:0">ひな形から作る</label><div class="chips">${TEMPLATES.map((t,i)=>`<button type="button" data-tpl="${i}">${t.icon} ${t.label}</button>`).join('')}</div>`}
   <div class="seg" style="margin-top:10px"><button type="button" data-k="save" aria-pressed="${kind==='save'}">貯金</button><button type="button" data-k="invest" aria-pressed="${kind==='invest'}">積み立て（投資）</button></div>

   <label for="gw">なぜ貯める？（カードに出る一言）</label><input id="gw" value="${esc(g.why||'')}" placeholder="例：家族で青い海を見る" maxlength="40">
   <div class="two"><div><label for="gt">目標金額</label><input id="gt" class="num" inputmode="numeric" value="${g.target?(+g.target).toLocaleString('ja-JP'):''}" placeholder="150,000" required></div>
   <div><label for="gd">期限（なくてもよい）</label><input id="gd" type="date" value="${g.deadline||''}"></div></div>
   <div class="two"><div><label for="aa">定期積立（毎月・なしは空）</label><input id="aa" class="num" inputmode="numeric" value="${au.amount?au.amount.toLocaleString('ja-JP'):''}" placeholder="例：20,000"></div>
   <div><label for="ad">積立日</label><select id="ad">${Array.from({length:28},(_,i)=>`<option value="${i+1}" ${au.day===i+1?'selected':''}>${i+1}日</option>`).join('')}</select></div></div>
   <p class="hint">設定すると、毎月この日を過ぎてアプリを開いたときに自動で記録します。</p>
   <label class="chk"><input type="checkbox" id="gnisa" ${g.nisa?'checked':''}> NISA の口座（年間枠・生涯枠の目安を出す）</label>
   <label class="chk"><input type="checkbox" id="gem" ${g.emergency?'checked':''}> 生活防衛資金（緊急用）として数える</label>
   <label>アイコン</label><div class="chips icons">${ICONS.map(i=>`<button type="button" data-i="${i}" aria-pressed="${i===icon}">${i}</button>`).join('')}</div>
   <label>色</label><div class="chips colors">${COLORS.map(c=>`<button type="button" data-c="${c}" style="--c:${c}" aria-pressed="${c===color}" aria-label="色"></button>`).join('')}</div>
   ${id?`<div class="btns"><button type="button" class="btn" data-arch>${g.archived?'ホームに戻す':'しまう（達成・中止）'}</button><button type="button" class="btn warn" data-delg>削除</button></div>`:''}
   <div class="btns"><button type="button" class="btn" data-close>やめる</button><button class="btn pri">${id?'保存':'作る'}</button></div></form>`);
  const f=$('#gf'),gt=$('#gt');
  if(!id)setTimeout(()=>$('#gn')?.focus(),50);
  for(const el of [gt,$('#aa')])el.addEventListener('input',()=>{const n=el.value.replace(/[^0-9]/g,'');el.value=n?(+n).toLocaleString('ja-JP'):''});
  f.addEventListener('click',e=>{
    const t=e.target.closest('button');if(!t)return;
    if(t.dataset.k){kind=t.dataset.k;f.querySelectorAll('[data-k]').forEach(b=>b.setAttribute('aria-pressed',b===t))}
    if(t.dataset.tpl){const p=TEMPLATES[+t.dataset.tpl].make();
      $('#gn').value=p.name;gt.value=p.target.toLocaleString('ja-JP');$('#gd').value=p.deadline||'';$('#aa').value=p.auto?p.auto.toLocaleString('ja-JP'):'';$('#gem').checked=!!p.emergency;
      kind='save';f.querySelectorAll('[data-k]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k==='save'));
      icon=p.icon;f.querySelectorAll('[data-i]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.i===icon));
      f.querySelectorAll('[data-tpl]').forEach(b=>b.setAttribute('aria-pressed',b===t));if(p.note)toast(p.note)}
    if(t.dataset.i){icon=t.dataset.i;f.querySelectorAll('[data-i]').forEach(b=>b.setAttribute('aria-pressed',b===t))}
    if(t.dataset.c){color=t.dataset.c;f.querySelectorAll('[data-c]').forEach(b=>b.setAttribute('aria-pressed',b===t))}
    if('arch' in t.dataset){g.archived=!g.archived;save();closeSheet();view.goal=null;render()}
    if('delg' in t.dataset){const n=S.tx.filter(x=>x.goalId===id).length;
      if(confirm(`「${g.name}」と記録${n}件を削除します。元に戻せません。`)){S.goals=S.goals.filter(x=>x.id!==id);S.tx=S.tx.filter(x=>x.goalId!==id);save();closeSheet();view.goal=null;render()}}
  });
  f.addEventListener('submit',e=>{
    e.preventDefault();
    const target=+gt.value.replace(/[^0-9]/g,'');if(!target){gt.focus();return}
    const amount=+$('#aa').value.replace(/[^0-9]/g,'')||0,day=+$('#ad').value;
    /* 定期積立は「次に来る積立日」から始める（今月の日がまだ先なら今月分から） */
    const startLast=()=>{const t=today();return t.slice(8)>=String(day).padStart(2,'0')?curYM():(()=>{const[y,m]=curYM().split('-').map(Number);const d=new Date(y,m-2,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')})()};
    const prev=g.auto||{};
    const auto=amount?{amount,day,last:(prev.amount&&prev.day===day)?prev.last:startLast()}:null;
    const v={name:$('#gn').value.trim(),why:$('#gw').value.trim(),target,deadline:$('#gd').value,icon,color,kind,auto,nisa:$('#gnisa').checked,emergency:$('#gem').checked};
    if(id)Object.assign(g,v);else S.goals.push({id:uid(),created:today(),archived:false,...v});
    save();closeSheet();runAuto();if(view.tab!=='home'){view.tab='home';view.goal=null}render();
    toast(id?'保存しました':'目標を作りました');
  });
}

/* バックアップ：ファイルに保存（iPhone は共有シートから「"ファイル"に保存」） */
async function backupFile(){
  const name='kotsukotsu-backup-'+today()+'.json';
  const file=new File([JSON.stringify(S)],name,{type:'application/json'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:name});
    else{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
    S.backupAt=today();S.dismiss['bk:'+curYM()]=1;save();render();toast('バックアップを保存しました');
  }catch(e){if(e&&e.name!=='AbortError')toast('保存できませんでした')}
}

/* 残高をまとめて入れる。reads（スクショから読んだもの）があれば先に入れておく */
function setBal(a,v,d){a.bal=v;a.at=d;a.hist=(a.hist||[]).filter(r=>r.d!==d);a.hist.push({d,v});a.hist.sort((x,y)=>x.d.localeCompare(y.d));if(a.hist[a.hist.length-1].d!==d){a.bal=a.hist[a.hist.length-1].v;a.at=a.hist[a.hist.length-1].d}}
function bankAllSheet(reads){
  reads=reads||[];const pre={};
  for(const r of reads.filter(r=>r.acct&&r.v!=null))pre[r.acct]=r;           // 口座がわかったもの（同じ口座は後の方）
  for(const r of reads.filter(r=>!r.acct&&r.v!=null)){const a=S.accounts.find(a=>!pre[a.id]);if(a)pre[a.id]={...r,guess:1}}
  const miss=reads.filter(r=>r.v==null).length;
  openSheet(`<form id="baf"><h3>残高を入れる</h3>
   ${reads.length?`<p class="hint" style="margin-top:0">スクショから読んだ額を入れました。違っていたら直して「保存」してください。${miss?`（${miss}件は金額が読めませんでした）`:''}</p>`
     :`<p class="hint" style="margin-top:0">銀行アプリの残高を入れて「保存」。空の口座はそのままです。</p>`}
   ${S.accounts.map((a,i)=>{const r=pre[a.id];return `<label for="bal-${a.id}">${a.icon} ${esc(a.name)}${r?` <small style="color:var(--acc)">${r.guess?'口座を推定・':''}${md(r.date)}のスクショ</small>`:a.at?` <small style="color:var(--sub)">前回 ${md(a.at)} ${yen(a.bal)}</small>`:''}</label>
     <input id="bal-${a.id}" data-acct="${a.id}" data-date="${r?r.date:''}" class="num" inputmode="numeric" enterkeyhint="${i<S.accounts.length-1?'next':'done'}" value="${r?r.v.toLocaleString('ja-JP'):''}" placeholder="${a.bal!=null?a.bal.toLocaleString('ja-JP'):'0'}">`}).join('')}
   <div class="btns"><button type="button" class="btn" data-close>やめる</button><button class="btn pri">保存</button></div>
   ${reads.length?'':'<div class="btns"><button type="button" class="btn" data-shot>スクショの記録を取り込む</button></div>'}</form>`);
  const ins=[...document.querySelectorAll('#baf [data-acct]')];
  if(!reads.length)setTimeout(()=>ins[0]&&ins[0].focus(),50);
  ins.forEach((el,i)=>{
    el.addEventListener('input',()=>{const n=el.value.replace(/[^0-9]/g,'');el.value=n?(+n).toLocaleString('ja-JP'):''});
    el.addEventListener('keydown',e=>{if(e.key==='Enter'&&i<ins.length-1){e.preventDefault();ins[i+1].focus()}});
  });
  $('#baf').addEventListener('click',e=>{if(e.target.closest('[data-shot]')){closeSheet();$('#payfile').click()}});
  $('#baf').addEventListener('submit',e=>{e.preventDefault();let n=0;
    for(const el of ins){const v=el.value.replace(/[^0-9]/g,'');if(v==='')continue;setBal(S.accounts.find(a=>a.id===el.dataset.acct),+v,el.dataset.date||today());n++}
    for(const r of reads)S.seen[r.key]=1;
    save();closeSheet();render();toast(n?`${n}口座の残高を保存しました`:'保存する残高がありませんでした')});
}

   ${x?'<div class="btns"><button type="button" class="btn" data-rename>名前を変える</button><button type="button" class="btn warn" data-delbank>口座を消す</button></div>':''}
   <div class="btns"><button type="button" class="btn" data-close>やめる</button><button class="btn pri">保存</button></div></form>`);

    if(n!=='')setBal(a,+n,today());
    save();closeSheet();render();toast(x?'残高を更新しました':'口座を追加しました')});
}

   <details style="margin-top:12px"${S.aiNote?' open':''}><summary class="hint" style="cursor:pointer">Claude の答えを残す（次の相談に要点が入ります）</summary>
    <textarea id="an" rows="4" placeholder="Claude の答えを貼り付け">${esc(S.aiNote?.text||'')}</textarea>
    ${S.aiNote?`<p class="hint">前回保存：${md(S.aiNote.date)}</p>`:''}
    <div class="btns"><button type="button" class="btn" data-savenote>答えを保存</button></div></details></form>`);
  const f=$('#af'),aq=$('#aq'),ap=$('#ap');
  const upd=()=>ap.textContent=summaryText(aq.value.trim());upd();
  aq.addEventListener('input',upd);
  f.addEventListener('click',e=>{
    if(e.target.closest('[data-savenote]')){const v=$('#an').value.trim();S.aiNote=v?{date:today(),text:v}:null;save();upd();toast(v?'答えを保存しました':'消しました');return}
    const t=e.target.closest('[data-ask]');if(!t)return;aq.value=ASK[+t.dataset.ask][1];upd();
    f.querySelectorAll('[data-ask]').forEach(b=>b.setAttribute('aria-pressed',b===t))});
  f.addEventListener('submit',async e=>{e.preventDefault();const s=summaryText(aq.value.trim());
    try{await navigator.clipboard.writeText(s)}catch(_){ap.parentElement.open=true;toast('内容を長押しでコピーしてください');return}
    closeSheet();toast('コピーしました。Claude に貼り付けてください');
    setTimeout(()=>{location.href='https://claude.ai/new'},600);
  });
}

    catch(_){toast('データの形が違います')}
  }
  else if('wipe' in d){if(confirm('すべての目標・記録・出費を消します。元に戻せません。')){S=fill({v:1,goals:[],tx:[],theme:S.theme});save();render()}}
  else if('tabCopy' in d){try{await navigator.clipboard.writeText('\t');toast('タブをコピーしました。テキストの間に貼り付けてください')}catch(_){toast('コピーできませんでした')}}
});

runAuto();
/* 開いたときに取れていた実績（月が変わって予算どおり、など）もお祝い */
{const nb=newBadges();render();if(nb.length)celebrate(nb[0][1],'実績をとりました',nb.map(b=>`${b[1]} ${b[2]}：${b[3]}`))}
$('#cele').addEventListener('click',()=>{$('#cele').hidden=true;$('#cele').innerHTML='';render()});
/* すぐ記録：#add で貯金、#spend で出費の入力を開く（Android はアイコン長押しのメニューから） */
if(location.hash==='#add')txSheet();
else if(location.hash==='#spend'){view.tab='spend';render();spendSheet()}
if(location.hash)history.replaceState(null,'',location.pathname);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){const n=S.tx.length;runAuto();if(S.tx.length!==n)render()}});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js');
</script>
</body></html>
