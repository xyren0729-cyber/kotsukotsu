<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>こつこつ</title>
<meta name="description" content="貯金の目標と、貯まっていく様子がひと目でわかる自分用アプリ">
<meta name="theme-color" content="#1f3a34">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="こつこつ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* 1カラム。上に合計、その下に目標カード。記録は右下の「＋」から。データは端末内（localStorage）に保存 */
:root{
  --bg:#f1f3f0; --surface:#ffffff; --ink:#1c2b27; --sub:#5d6b66; --line:#d9dfdb;
  --acc:#1f6f5c; --accink:#ffffff; --accsoft:#e2efea;
  --in:#1f6f5c; --out:#b4452f; --done:#c08a00;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;
  color-scheme:light
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#18211e; --ink:#e6ece9; --sub:#9aa8a2; --line:#2a3632;
  --acc:#4fbf9f; --accink:#0f1513; --accsoft:#1d302a; --in:#4fbf9f; --out:#f08a72; --done:#e9b84c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#18211e; --ink:#e6ece9; --sub:#9aa8a2; --line:#2a3632;
  --acc:#4fbf9f; --accink:#0f1513; --accsoft:#1d302a; --in:#4fbf9f; --out:#f08a72; --done:#e9b84c; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body);
  padding:max(12px,env(safe-area-inset-top,0px)) 16px calc(84px + env(safe-area-inset-bottom,0px))}
main{max-width:520px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
h1{font-size:15px;margin:0 0 10px;color:var(--sub);font-weight:700;display:flex;justify-content:space-between}
h2{font-size:14px;color:var(--sub);margin:18px 0 8px;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}

/* 合計 */
.total .big{font-size:34px;font-weight:700;line-height:1.2}
.total .row{display:flex;gap:16px;color:var(--sub);font-size:14px;margin-top:4px}
.plus{color:var(--in)} .minus{color:var(--out)}

/* 目標カード */
.goal{display:block;width:100%;text-align:left;border:1px solid var(--line)}
.goal .top{display:flex;align-items:center;gap:10px}
.goal .ic{font-size:22px;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--accsoft);flex:none}
.goal .name{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goal .pct{font-weight:700}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--c,var(--acc))}
.goal .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);gap:8px}
.btn.ai{width:100%;margin-top:12px;background:var(--accsoft);border-color:transparent;color:var(--ink)}
/* お知らせ（起きたときだけ） */
.note{display:flex;align-items:center;gap:8px;background:var(--accsoft);border-radius:12px;padding:8px 6px 8px 12px;margin-bottom:8px;font-size:14px;line-height:1.5}
.note>span{flex:1;min-width:0}
.nb{border:0;background:var(--acc);color:var(--accink);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:700;flex:none}
.hd{display:flex;align-items:center;gap:2px}.eye{font-size:16px}
body.hide main .num,body.hide main .chart text{filter:blur(7px)}
/* 予算の色 */
.bar.lv-ok i{background:var(--acc)}.bar.lv-warn i{background:var(--done)}.bar.lv-over i{background:var(--out)}
.lvt-warn{color:var(--done)}.lvt-over{color:var(--out)}
.cb{font-size:11px;color:var(--sub);font-weight:400}
.rec summary{display:flex;justify-content:space-between;gap:8px;cursor:pointer;font-size:14px;list-style:none}
.rec summary::-webkit-details-marker{display:none}
.bcats{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}.bcats label{margin:6px 0 0}
.chk{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14px}.chk input{width:auto;margin:0}
.frame{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.fr{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--sub);padding:2px 0}.fr b{color:var(--ink)}
.simres{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0 6px}
.simres div{background:var(--bg);border-radius:10px;padding:6px 10px;min-width:0}.simres small{display:block;font-size:11px;color:var(--sub)}.simres b{font-size:15px}
.simres div:first-child{grid-column:1/-1}.simres div:first-child b{font-size:24px}
.guide summary{cursor:pointer;font-weight:700;font-size:14px}
.guide ol{padding-left:1.3em;margin:8px 0;font-size:14px}.guide li{margin-bottom:6px}
.guide code{background:var(--bg);border-radius:4px;padding:0 4px;font-size:13px}
.mon{display:flex;align-items:center;gap:4px;color:var(--ink)}
.mon .x{font-size:20px;color:var(--acc)} .mon .x:disabled{opacity:.3}
.cat{display:grid;grid-template-columns:7.5em 1fr auto;align-items:center;gap:8px;font-size:14px;padding:3px 0}
.cbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.cbar i{display:block;height:100%;border-radius:4px}
.list li.day{font-size:12px;color:var(--sub);font-weight:700;padding:10px 0 2px;border-bottom:0}
.tag{font-size:11px;font-weight:700;color:var(--sub);border:1px solid var(--line);border-radius:6px;padding:0 6px}
/* お祝い（紙吹雪） */
.cele{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);overflow:hidden}
.cele .box{background:var(--surface);border-radius:20px;padding:22px 24px;text-align:center;max-width:300px;margin:0 16px;animation:pop .35s ease-out;position:relative;z-index:2}
.cele .em{font-size:48px;line-height:1.1}.cele h3{margin:8px 0 4px;font-size:19px}.cele p{margin:4px 0;color:var(--sub);font-size:14px;line-height:1.6}
.cele i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall 1.9s ease-in forwards;z-index:1}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.cele i{display:none}.cele .box{animation:none}}
.bar{position:relative}.bar .mk{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55;border-radius:1px}
.ph{display:block;width:calc(100% + 32px);margin:-14px -16px 10px;height:88px;object-fit:cover;border-radius:14px 14px 0 0}
.cal{display:block;width:100%;height:auto}.cal rect{rx:1.5}
.grade{font-size:56px;font-weight:800;line-height:1;text-align:center;margin:6px 0}
.chk2{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.5}.chk2 input{margin-top:4px;flex:none}
.scroll{max-height:42vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:0 10px;margin-top:8px}
.why{font-size:12.5px;color:var(--sub);margin-top:6px;font-style:italic}
.future{font-size:13px;color:var(--sub);margin-top:6px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.badges div{border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;font-size:11.5px;line-height:1.35}
.badges div b{display:block;font-size:26px;margin-bottom:2px}
.badges div.no{opacity:.35;filter:grayscale(1)}
.badge{font-size:12px;font-weight:700;color:var(--done);border:1px solid var(--done);border-radius:999px;padding:0 8px}
.empty{color:var(--sub);text-align:center;padding:28px 8px}

/* 詳細 */
.back{background:none;border:0;color:var(--acc);padding:4px 0;margin-bottom:6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.stats div{background:var(--bg);border-radius:10px;padding:8px 10px}
.stats small{display:block;color:var(--sub);font-size:12px}
.stats b{font-size:17px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .d{color:var(--sub);font-size:13px;width:48px;flex:none}
.list .m{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .a{font-weight:700}
.x{background:none;border:0;color:var(--sub);padding:2px 6px;font-size:18px;line-height:1}
.btns{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;font-weight:700}
.btn.pri{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.btn.warn{color:var(--out)}

/* グラフ */
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--sub);font-size:11px;font-family:var(--f-body)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--sub);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:5px;vertical-align:-1px}

/* 下のタブ */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs button{flex:1;max-width:173px;background:none;border:0;padding:10px 0 12px;color:var(--sub);font-size:13px;font-weight:700}
nav.tabs button[aria-current="page"]{color:var(--acc)}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:6;
  width:56px;height:56px;border-radius:50%;border:0;background:var(--acc);color:var(--accink);font-size:30px;line-height:1;
  box-shadow:0 4px 14px rgba(0,0,0,.18)}

/* 入力シート */
.sheet{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet form{background:var(--surface);width:100%;max-width:520px;border-radius:18px 18px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 10px;font-size:16px}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px}
.amount{font-size:28px;font-weight:700;text-align:right}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--bg);padding:8px;font-weight:700;color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--accink)}
.seg button.out[aria-pressed="true"]{background:var(--out);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:14px}
.chips button[aria-pressed="true"]{border-color:var(--acc);background:var(--accsoft);color:var(--ink);font-weight:700}
.quick{display:flex;gap:6px;margin-top:6px}
.quick button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 0;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.icons button{font-size:20px;padding:4px 8px}
.colors button{width:30px;height:30px;padding:0;border-radius:50%;background:var(--c)}
.colors button[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.hint{font-size:13px;color:var(--sub);margin:6px 0 0}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;
  background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;white-space:nowrap}
</style>
</head>
<body>
<main id="app"></main>
<button class="fab" id="fab" aria-label="記録する">＋</button>
<nav class="tabs">
  <button data-tab="home">ホーム</button>
  <button data-tab="spend">出費</button>
  <button data-tab="chart">グラフ</button>
  <button data-tab="settings">設定</button>
</nav>
<div class="sheet" id="sheet" hidden></div>
<input type="file" id="payfile" accept=".txt,text/plain" hidden>
<input type="file" id="restorefile" accept=".json,application/json" hidden>
<input type="file" id="csvfile" accept=".csv,text/csv,text/plain" hidden>
<div class="toast" id="toast" hidden></div>
<div class="cele" id="cele" hidden></div>

<script>
'use strict';
const KEY='kotsukotsu-v1';
const ICONS=['💰','✈️','🏠','🚗','💻','🎓','🎁','📷','🎮','🏝️','💍','🩺'];
const COLORS=['#1f6f5c','#2f6db5','#b4452f','#c08a00','#7a4fb0','#3a8f9e'];
const $=s=>document.querySelector(s);
const yen=n=>(n<0?'−¥':'¥')+Math.abs(Math.round(n)).toLocaleString('ja-JP');
const sgn=n=>(n>0?'+':n<0?'−':'')+yen(Math.abs(n));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const md=s=>{const[,m,d]=s.split('-');return (+m)+'/'+(+d)};

/* ---------- 保存 ---------- */
let S=load();
function load(){
  let s=null;
  try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!s||!s.goals)s={v:1,goals:[],tx:[],theme:'auto'};
  return fill(s);
}
/* 出費まわりの項目がない古いデータにも足す */
function fill(s){
  s.spend=s.spend||[];s.rules=s.rules||{};s.seen=s.seen||{};
  s.budget=s.budget||{total:0,cats:{}};s.fixed=s.fixed||[];s.dismiss=s.dismiss||{};s.wish=s.wish||[];s.cards=s.cards||[];
  /* 銀行口座の残高（手で入れる）。最初はゆうちょと三菱UFJ */
  if(!s.accounts)s.accounts=[{id:'yucho',name:'ゆうちょ銀行',icon:'📮',bal:null,at:null,hist:[]},{id:'mufg',name:'三菱UFJ銀行',icon:'🏦',bal:null,at:null,hist:[]}];
  return s;
}

/* ---------- 出費 ---------- */
const CATS=[['食費','🍙'],['カフェ','☕'],['コンビニ','🏪'],['交通','🚃'],['買い物','🛍️'],['日用品','🧴'],['娯楽','🎬'],['サブスク','🔁'],['住まい・光熱','🏠'],['通信','📱'],['その他','📦']];
const CAT_ICON=Object.fromEntries(CATS);
const CAT_COLOR={'食費':'#1f6f5c','カフェ':'#8a5a3c','コンビニ':'#2f6db5','交通':'#3a8f9e','買い物':'#b4452f','日用品':'#7a4fb0','娯楽':'#c08a00','サブスク':'#5d6b66','住まい・光熱':'#6b7f3a','通信':'#4a5fa8','その他':'#9aa8a2'};
/* 店名から分類する。自分で直した分類（S.rules）を先に使う */
const AUTO_RULES=[
  ['住まい・光熱',/ガス|ｶﾞｽ|電力|ﾃﾞﾝﾘﾖｸ|ﾃﾞﾝﾘｮｸ|電気|ﾃﾞﾝｷ|水道|ｽｲﾄﾞｳ|家賃|ﾔﾁﾝ|管理費|ｶﾝﾘﾋ|ENEOSでんき|東京電力|関西電力|中部電力/i],
  ['通信',/ドコモ|ﾄﾞｺﾓ|DOCOMO|ソフトバンク|ｿﾌﾄﾊﾞﾝｸ|SOFTBANK|KDDI|ＫＤＤＩ|楽天モバイル|ﾗｸﾃﾝﾓﾊﾞｲﾙ|ワイモバイル|ﾜｲﾓﾊﾞｲﾙ|Y!MOBILE|UQ|AHAMO|POVO|LINEMO|ﾌﾟﾛﾊﾞｲﾀﾞ|NTTｺﾐﾕﾆｹ|ﾋｶﾘ|光回線/i],
  ['コンビニ',/セブン|ｾﾌﾞﾝ|7-?ELEVEN|ローソン|LAWSON|ファミリーマート|ファミマ|FAMILYMART|ミニストップ|デイリーヤマザキ/i],
  ['カフェ',/スターバックス|STARBUCKS|ドトール|DOUTOR|タリーズ|TULLY|コメダ|エクセルシオール|ブルーボトル|カフェ|CAFE|COFFEE/i],
  ['交通',/^JR|ＪＲ|SUICA|ICOCA|PASMO|モバイルSuica|阪急|阪神|京阪|近鉄|南海|メトロ|METRO|地下鉄|タクシー|TAXI|^GO$|バス/i],
  ['サブスク',/APPLE\.COM|ITUNES|SPOTIFY|NETFLIX|AMAZON PRIME|プライム|YOUTUBE|DISNEY|ADOBE|CHATGPT|OPENAI|ANTHROPIC|CLAUDE/i],
  ['食費',/マクドナルド|MCDONALD|吉野家|すき家|松屋|サイゼリヤ|ガスト|スシロー|くら寿司|はま寿司|モスバーガー|ケンタッキー|KFC|丸亀|餃子の王将|CoCo壱|スーパー|ライフ|イオン|AEON|業務スーパー|万代|コープ|成城石井/i],
  ['日用品',/マツモトキヨシ|マツキヨ|スギ薬局|ココカラ|ダイソー|DAISO|セリア|キャンドゥ|ドラッグ|薬局|ツルハ|ウエルシア/i],
  ['買い物',/AMAZON|アマゾン|楽天|RAKUTEN|ユニクロ|UNIQLO|^GU$|ジーユー|無印|MUJI|ZARA|ヨドバシ|ビックカメラ|ロフト|LOFT|ハンズ|ZOZO/i],
  ['娯楽',/映画|シネマ|CINEMA|TOHO|イオンシネマ|カラオケ|ラウンドワン|ROUND1|チケット|TICKET|ゲーム|NINTENDO|PLAYSTATION|STEAM/i]
];
function guessCat(m){
  if(S.rules[m])return S.rules[m];
  for(const[c,re]of AUTO_RULES)if(re.test(m))return c;
  return 'その他';
}
const spendIn=k=>S.spend.filter(x=>ym(x.date)===k);
const spendTotal=k=>spendIn(k).reduce((a,x)=>a+x.amount,0);
function byCat(k){const o={};for(const x of spendIn(k))o[x.cat]=(o[x.cat]||0)+x.amount;return Object.entries(o).sort((a,b)=>b[1]-a[1])}
const prevYM=k=>{const[y,m]=k.split('-').map(Number);const d=new Date(y,m-2,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const daysInMonth=k=>{const[y,m]=k.split('-').map(Number);return new Date(y,m,0).getDate()};
/* 予算の使い方で色を決める：〜80% ふつう、〜100% 注意、超え 赤 */
const level=(used,b)=>!b?'':used>b?'over':used>b*.8?'warn':'ok';

/* 毎月同じ店・ほぼ同じ金額の支払い（サブスク・固定費）を見つける。直近4か月で2か月以上、金額の差が15%以内 */
function recurring(){
  const since=(()=>{let k=curYM();for(let i=0;i<3;i++)k=prevYM(k);return k})();
  const by={};
  for(const x of S.spend){if(x.src==='fixed'||ym(x.date)<since)continue;(by[x.merchant]=by[x.merchant]||[]).push(x)}
  const out=[];
  for(const[m,xs]of Object.entries(by)){
    const months=new Set(xs.map(x=>ym(x.date)));if(months.size<2)continue;

/* ショートカットが書いたファイルを読む。1行＝「日時<TAB>店名<TAB>金額<TAB>カード」。同じ行は二度入れない */
function parsePayLog(text){
  const out=[];
  for(const raw of text.split(/\r?\n/)){
    const line=raw.trim();if(!line)continue;
    const p=line.split('\t');if(p.length<3||p[1].trim()==='残高')continue;
    const dm=p[0].match(/(\d{4})[-\/年.](\d{1,2})[-\/月.](\d{1,2})/);if(!dm)continue;
    const date=dm[1]+'-'+dm[2].padStart(2,'0')+'-'+dm[3].padStart(2,'0');
    const tm=p[0].match(/(\d{1,2}):(\d{2})/),time=tm?tm[1].padStart(2,'0')+':'+tm[2]:'';
    const merchant=p[1].trim()||'（店名なし）';
    const amount=Math.round(parseFloat(p[2].replace(/[^0-9.]/g,'')));
    if(!amount)continue;
    out.push({key:line,date,time,merchant,amount,card:(p[3]||'').trim()});
  }
  return out;
}

const ACCT_KW={yucho:/ゆうちょ|ゆうちよ|郵便|JP\s?BANK/i,mufg:/三菱|MUFG|UFJ/i};
function acctOf(t){
  for(const a of S.accounts){const kw=ACCT_KW[a.id]||new RegExp(a.name.replace(/銀行$/,'').replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i');if(kw.test(t))return a.id}
  return null;
}
function readAmount(t){
  t=t.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[，､]/g,',').replace(/￥/g,'¥');
  const re=/[¥]\s*(\d{1,3}(?:,\d{3})+|\d+)|(\d{1,3}(?:,\d{3})+|\d+)\s*円/g,c=[];let m;
  while((m=re.exec(t)))c.push({i:m.index,v:+(m[1]||m[2]).replace(/,/g,'')});
  if(!c.length)return null;
  const k=t.search(/残高|お預り|預金|お預かり/);
  const after=k>=0?c.find(x=>x.i>k):null;
  return (after||c.reduce((a,b)=>b.v>a.v?b:a)).v;
}
function parseBalLog(text){
  const out=[];
  for(const raw of text.split(/\r?\n/)){
    const p=raw.trim().split('\t');if(p.length<3||p[1].trim()!=='残高')continue;
    const dm=p[0].match(/(\d{4})[-\/年.](\d{1,2})[-\/月.](\d{1,2})/);if(!dm)continue;
    const body=p.slice(2).join(' ');
    out.push({key:raw.trim(),date:dm[1]+'-'+dm[2].padStart(2,'0')+'-'+dm[3].padStart(2,'0'),acct:acctOf(body),v:readAmount(body)});
  }

}

  if(!deadline)return null;

/* 直近3か月の入金ペースから、達成見込みの月を出す */
function forecast(g){
  const rest=g.target-current(g);if(rest<=0)return null;
  const now=new Date(),keys=[];
  for(let i=1;i<=3;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1);keys.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'))}
  const pace=S.tx.filter(t=>t.goalId===g.id&&keys.includes(ym(t.date))).reduce((a,t)=>a+t.amount,0)/3;
  if(pace<=0)return null;
  const d=new Date(now.getFullYear(),now.getMonth()+Math.ceil(rest/pace),1);
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月ごろ';
}

  const prev=(()=>{const[y,m]=now.split('-').map(Number);const d=new Date(y,m-2,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')})();
  if(S.spend.length){

    if(S.budget.total)L.push(`月の予算：${yen(S.budget.total)}`+(Object.keys(S.budget.cats).length?'（'+Object.entries(S.budget.cats).map(([c,v])=>`${c} ${yen(v)}`).join('、')+'）':''));
    const rc=recurring();if(rc.length)L.push('毎月の支払い：'+rc.map(r=>`${r.name} ${yen(r.amount)}`).join('、'));
    const waste=spendIn(now).concat(spendIn(prev)).filter(x=>x.feel==='bad');
    if(waste.length)L.push(`「ムダだった」と記録した出費（先月〜今月）：${waste.length}件、${yen(waste.reduce((a,x)=>a+x.amount,0))}（`+waste.slice(0,8).map(x=>x.merchant).join('、')+'）');
  }
  if(S.spend.length){const I=insights();if(I.length)L.push('','■ 見直しポイント（アプリがルールで自動計算したもの）',...I.slice(0,6).map(o=>`・${o.title.replace(/<[^>]+>/g,'')}：${o.detail.replace(/<[^>]+>/g,'')}${o.effect?`（${o.effect.replace(/<[^>]+>/g,'')}）`:''}`))}
  if(S.aiNote&&S.aiNote.text)L.push('',`■ 前回（${S.aiNote.date}）の相談で AI から言われたこと（要点）`,S.aiNote.text.slice(0,600));
  L.push('','■ 相談したいこと',q,'');

  return L.join('\n');
}

    if(w&&!off('short:'+w[0]+':'+w[1].d)){const a=S.accounts.find(x=>x.id===w[0]);note('short:'+w[0]+':'+w[1].d,`⚠️ ${md(w[1].d)}ごろ ${esc(a.name)}の残高が足りなくなりそうです（見込み ${yen(w[1].v)}）`,'<button class="nb" data-tabgo="chart">見る</button>')}}

  }

    const old=!g.valueDate||(new Date(today())-new Date(g.valueDate))/864e5>30;
    if(old&&!off('val:'+g.id+':'+cur))note('val:'+g.id+':'+cur,`「${esc(g.name)}」の評価額を更新しましょう${g.valueDate?'（前回 '+md(g.valueDate)+'）':''}`,`<button class="nb" data-value="${g.id}">更新</button>`);
  }

  for(const w of S.wish)if(!w.done&&wishAge(w)>=WAIT&&!off('wish:'+w.id))note('wish:'+w.id,`「${esc(w.name)}」を待って${WAIT}日。まだ欲しい？`,'<button class="nb" data-tabgo="spend">決める</button>');
  const oldAc=S.accounts.filter(x=>x.bal!=null&&(new Date(today())-new Date(x.at))/864e5>30);

  return N.slice(0,3).join('');

/* 月末の貯金額（目標ごとの積み上げ棒）を直近12か月で表示 */
function chartHTML(){
  const now=new Date(),months=[];
  for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'))}
  const gs=S.goals;
  const data=months.map(m=>gs.map(g=>Math.max(0,S.tx.filter(t=>t.goalId===g.id&&ym(t.date)<=m).reduce((a,t)=>a+t.amount,0))));
  const max=Math.max(1,...data.map(r=>r.reduce((a,b)=>a+b,0)));
  const W=340,H=180,L=40,B=20,bw=(W-L)/12;
  const nice=niceMax(max);
  let svg=`<svg viewBox="0 0 ${W} ${H+B}" role="img" aria-label="月末の貯金額">`;
  for(let i=0;i<=2;i++){const y=H-H*i/2;svg+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-4}" y="${y+4}" text-anchor="end">${short(nice*i/2)}</text>`}
  data.forEach((r,i)=>{let y=H;r.forEach((v,j)=>{if(!v)return;const h=v/nice*H;y-=h;svg+=`<rect x="${L+i*bw+bw*.18}" y="${y}" width="${bw*.64}" height="${h}" fill="${gs[j].color}" rx="1.5"><title>${esc(gs[j].name)} ${yen(v)}</title></rect>`});
    if(i%2===1||i===11)svg+=`<text x="${L+i*bw+bw/2}" y="${H+15}" text-anchor="middle">${+months[i].slice(5)}月</text>`});
  svg+=`</svg>`;
  const nets=months.slice(-6).map(m=>[m,monthNet(m)]);
  return `<h1><span>グラフ</span><button class="nb" data-report>📝 月の通信簿</button></h1>
  ${projHTML()}
  ${calHTML()}
  <h2>月末の貯金</h2><section class="card chart"><div style="font-size:13px;color:var(--sub);margin-bottom:6px">月末の貯金（12か月）</div>${S.tx.length?svg:'<div class="empty">記録がたまると表示されます</div>'}
  <div class="legend">${gs.map(g=>`<span style="--c:${g.color}">${esc(g.name)}</span>`).join('')}</div></section>
  <h2>月ごとの増減</h2><section class="card"><ul class="list">${nets.reverse().map(([m,n])=>`<li><span class="m">${m.slice(0,4)}年${+m.slice(5)}月</span><span class="a num ${n>=0?'plus':'minus'}">${sgn(n)}</span></li>`).join('')}</ul></section>
  ${defenseHTML()}
  <h2>積立シミュレーター</h2><section class="card sim">
   <div class="two"><div><label for="sim-m">毎月の積立</label><input id="sim-m" class="num" inputmode="numeric" value="${sim.m.toLocaleString('ja-JP')}"></div>
   <div><label for="sim-i">いまある額</label><input id="sim-i" class="num" inputmode="numeric" value="${sim.i.toLocaleString('ja-JP')}"></div></div>
   <div class="two"><div><label for="sim-y">年数</label><input id="sim-y" class="num" inputmode="numeric" value="${sim.y}"></div>
   <div><label for="sim-r">想定の利回り（年 %）</label><input id="sim-r" class="num" inputmode="decimal" value="${sim.r}"></div></div>
   <div id="simout">${simOut()}</div>
   <p class="hint">毎月複利で計算した目安です。実際の値動きは上下し、この通りに増える保証はありません。</p></section>`;
}
/* シミュレーターの入力（はじめは積み立て目標の合計から） */
const invGoals=()=>activeGoals().filter(g=>g.kind==='invest');
let sim={m:invGoals().reduce((a,g)=>a+(g.auto?.amount||0),0)||30000,i:invGoals().reduce((a,g)=>a+current(g),0),y:20,r:3};
function simOut(){
  const rows=simulate(sim.i,sim.m,Math.min(50,Math.max(1,sim.y)),sim.r);if(!rows.length)return '';
  const last=rows.at(-1),gain=last.v-last.p,mx=niceMax(last.v);
  const pick=rows.filter(r=>r.y%5===0||r.y===rows.length).slice(-10);
  const W=320,H=120,bw=W/pick.length;
  let svg=`<svg viewBox="0 0 ${W} ${H+18}" role="img" aria-label="積立の将来額">`;
  pick.forEach((r,i)=>{const hp=r.p/mx*H,hv=(r.v-r.p)/mx*H,x=i*bw+bw*.2,w=bw*.6;
    svg+=`<rect x="${x}" y="${H-hp}" width="${w}" height="${hp}" fill="var(--acc)" opacity=".45" rx="1.5"/><rect x="${x}" y="${H-hp-Math.max(0,hv)}" width="${w}" height="${Math.max(0,hv)}" fill="var(--acc)" rx="1.5"/><text x="${x+w/2}" y="${H+14}" text-anchor="middle">${r.y}年</text>`});
  svg+='</svg>';
  return `<div class="simres"><div><small>${rows.length}年後</small><b class="num">${yen(last.v)}</b></div><div><small>入れた額</small><b class="num">${yen(last.p)}</b></div><div><small>増えた分</small><b class="num ${gain>=0?'plus':'minus'}">${sgn(gain)}</b></div></div>
   <div class="chart">${svg}</div><div class="legend"><span style="--c:color-mix(in srgb,var(--acc) 45%,transparent)">入れた額</span><span style="--c:var(--acc)">増えた分</span></div>`;
}
/* 生活防衛資金の目安：ふだんの1か月の出費 × 3〜6か月 */
function defenseHTML(){
  const avg=avgSpend();if(!avg)return '';
  const em=activeGoals().filter(g=>g.emergency),src=em.length?em:activeGoals().filter(g=>g.kind!=='invest');
  const have=src.reduce((a,g)=>a+current(g),0),lo=avg*3,hi=avg*6;
  const msg=have>=hi?'6か月分あります。安心な水準です':have>=lo?'3か月分はあります。6か月分あるとさらに安心です':`3か月分まで あと ${yen(lo-have)}`;
  return `<h2>生活防衛資金の目安</h2><section class="card">
   <div class="fr"><span>ふだんの1か月の出費（直近の平均）</span><b class="num">${yen(avg)}</b></div>
   <div class="fr"><span>目安（3〜6か月分）</span><b class="num">${yen(lo)} 〜 ${yen(hi)}</b></div>

   <div class="bar"><i style="width:${Math.min(100,have/hi*100)}%"></i></div>
   <p class="hint" style="margin-top:2px">${msg}。出費は記録した分だけで計算しているので、家賃など記録していない支払いがあれば実際はもっと多めです。</p></section>`;
}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));for(const k of[1,2,2.5,5,10])if(k*p>=v)return k*p;return 10*p}
function short(v){return v>=10000?(v/10000).toLocaleString('ja-JP',{maximumFractionDigits:1})+'万':Math.round(v).toLocaleString('ja-JP')}

function openSheet(html){const s=$('#sheet');s.innerHTML=html;s.hidden=false}
function closeSheet(){$('#sheet').hidden=true;$('#sheet').innerHTML=''}

function txSheet(gid,preset,memo){
  const gs=activeGoals();
  if(!gs.length)return goalSheet();
  let sel=gid||gs[0].id,sign=1;
  setTimeout(()=>{if(preset&&$('#amt'))$('#amt').value=(+preset).toLocaleString('ja-JP');if(memo&&$('#memo'))$('#memo').value=memo},0);
  openSheet(`<form id="txf"><h3>記録する</h3>
   <div class="seg"><button type="button" data-sign="1" aria-pressed="true">入金</button><button type="button" class="out" data-sign="-1" aria-pressed="false">出金</button></div>
   <label for="amt">金額</label><input id="amt" class="amount num" inputmode="numeric" pattern="[0-9,]*" placeholder="0" autocomplete="off" required>
   <div class="quick">${[1000,5000,10000,30000].map(v=>`<button type="button" data-q="${v}">+${short(v)}</button>`).join('')}</div>
   <button type="button" class="btn" style="width:100%;margin-top:8px" data-split>🎁 ボーナスなどを目標に振り分ける</button>
   <label>目標</label><div class="chips">${gs.map(g=>`<button type="button" data-g="${g.id}" aria-pressed="${g.id===sel}">${g.icon} ${esc(g.name)}</button>`).join('')}</div>
   <div class="two"><div><label for="dt">日付</label><input id="dt" type="date" value="${today()}" required></div>
   <div><label for="memo">メモ</label><input id="memo" placeholder="例：給料から" maxlength="40"></div></div>
   <div class="btns"><button type="button" class="btn" data-close>やめる</button><button class="btn pri">記録する</button></div></form>`);
  const f=$('#txf'),amt=$('#amt');
  setTimeout(()=>amt.focus(),50);
  amt.addEventListener('input',()=>{const n=amt.value.replace(/[^0-9]/g,'');amt.value=n?(+n).toLocaleString('ja-JP'):''});
  f.addEventListener('click',e=>{
    const t=e.target.closest('button');if(!t)return;
    if(t.dataset.sign){sign=+t.dataset.sign;f.querySelectorAll('[data-sign]').forEach(b=>b.setAttribute('aria-pressed',b===t))}
    if(t.dataset.g){sel=t.dataset.g;f.querySelectorAll('[data-g]').forEach(b=>b.setAttribute('aria-pressed',b===t))}
    if('split' in t.dataset){closeSheet();splitSheet();return}
    if(t.dataset.q){const n=(+amt.value.replace(/[^0-9]/g,'')||0)+(+t.dataset.q);amt.value=n.toLocaleString('ja-JP')}
  });
  f.addEventListener('submit',e=>{
    e.preventDefault();
    const n=+amt.value.replace(/[^0-9]/g,'');if(!n){amt.focus();return}
    const g=S.goals.find(x=>x.id===sel),before=current(g),tb=totalAll();
    S.tx.push({id:uid(),goalId:sel,amount:sign*n,date:$('#dt').value||today(),memo:$('#memo').value.trim()});
    save();closeSheet();render();
    if(sign>0)cheer(g,before,current(g),tb,n);else toast(`${yen(n)} 出金しました`);
  });
}

   <div class="btns" style="margin-top:6px"><button type="button" class="btn" data-pickph>${g.photo?'写真を変える':'写真を選ぶ'}</button>${g.photo?'<button type="button" class="btn" data-delph>写真を外す</button>':''}</div>
   <input type="file" id="gph" accept="image/*" hidden>

    if(t.dataset.i){icon=t.dataset.i;f.querySelectorAll('[data-i]').forEach(b=>b.setAttribute('aria-pressed',b===t))}
    if(t.dataset.c){color=t.dataset.c;f.querySelectorAll('[data-c]').forEach(b=>b.setAttribute('aria-pressed',b===t))}

      const w=Math.min(640,img.naturalWidth),h=Math.round(img.naturalHeight*w/img.naturalWidth),c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);photo=c.toDataURL('image/jpeg',.7);URL.revokeObjectURL(img.src);
      $('#phw').innerHTML=`<img src="${photo}" alt="" style="width:100%;height:110px;object-fit:cover;border-radius:10px">`}

    const prev=g.auto||{};
    const auto=amount?{amount,day,last:(prev.amount&&prev.day===day)?prev.last:startLast()}:null;
    const v={name:$('#gn').value.trim(),why:$('#gw').value.trim(),photo,target,deadline:$('#gd').value,icon,color,kind,auto,nisa:$('#gnisa').checked,emergency:$('#gem').checked};
    if(id)Object.assign(g,v);else S.goals.push({id:uid(),created:today(),archived:false,...v});
    save();closeSheet();runAuto();if(view.tab!=='home'){view.tab='home';view.goal=null}render();
    toast(id?'保存しました':'目標を作りました');
  });
}

/* バックアップ：ファイルに保存（iPhone は共有シートから「"ファイル"に保存」） */
async function backupFile(){
  const name='kotsukotsu-backup-'+today()+'.json';
  const file=new File([JSON.stringify(S)],name,{type:'application/json'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:name});
    else{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
    S.backupAt=today();S.dismiss['bk:'+curYM()]=1;save();render();toast('バックアップを保存しました');
  }catch(e){if(e&&e.name!=='AbortError')toast('保存できませんでした')}
}

/* ---------- 予定ライン：期限までまっすぐ貯めたら今日いくらか ---------- */
function plan(g){
  if(!g.deadline||!g.created||current(g)>=g.target)return null;
  const s=new Date(g.created),e=new Date(g.deadline),t=new Date(today());if(e<=s)return null;
  const r=Math.min(1,Math.max(0,(t-s)/(e-s)));return {at:Math.round(g.target*r),pct:r*100,diff:current(g)-Math.round(g.target*r)};
}

/* ---------- 銀行の明細 CSV ---------- */
function csvRows(t){const R=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);R.push(row);row=[];f=''}else f+=c}
  if(f||row.length){row.push(f);R.push(row)}return R}
function jdate(s){
  s=String(s).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).trim();let m;
  const p=(y,mo,d)=>y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  if((m=s.match(/(R|令和|H|平成)\s*(\d{1,2})[.\/年\-](\d{1,2})[.\/月\-](\d{1,2})/)))return p((/R|令/.test(m[1])?2018:1988)+ +m[2],m[3],m[4]);
  if((m=s.match(/(\d{4})[.\/年\-](\d{1,2})[.\/月\-](\d{1,2})/)))return p(m[1],m[2],m[3]);
  if((m=s.match(/^(\d{4})(\d{2})(\d{2})$/)))return p(m[1],m[2],m[3]);
  return null;
}
async function readCSV(file){
  const buf=await file.arrayBuffer();let t=new TextDecoder('utf-8').decode(buf);
  if(t.includes('�'))t=new TextDecoder('shift_jis').decode(buf);
  const R=csvRows(t.replace(/^﻿/,''));const num=v=>{const n=String(v||'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[^0-9.\-]/g,'');return n?Math.round(+n):0};
  let h=-1,col={};
  for(let i=0;i<Math.min(R.length,20);i++){const r=R[i].map(c=>c.trim());const di=r.findIndex(c=>/日付|取引日|年月日/.test(c));if(di<0)continue;
    const fi=re=>r.findIndex((c,j)=>j!==di&&re.test(c));
    col={d:di,o:fi(/支払|払出|出金|引出|お引出/),i:fi(/預か|預り|預入|受入|入金/),b:fi(/残高|現在.{0,6}高/),a:fi(/^金額|取引金額/),k:fi(/区分/)};
    col.x=r.map((c,j)=>/摘要|詳細|内容|お取引|取引名|メモ/.test(c)&&![col.d,col.o,col.i,col.b,col.a,col.k].includes(j)?j:-1).filter(j=>j>=0);

/* ---------- クレジットカード：締め日・引き落とし日から請求を予測 ---------- */
const fmtD=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addM=(k,n)=>{const[y,m]=k.split('-').map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const dayIn=(k,day)=>k+'-'+String(Math.min(day,daysInMonth(k))).padStart(2,'0');
/* 日本の祝日（固定・ハッピーマンデー・春分/秋分の近似・振替休日・国民の休日）。年末年始の銀行休業日（12/31〜1/3）も休みに数える */
const HOL={};
function holidays(y){
  if(HOL[y])return HOL[y];const s=new Set(),p=(m,d)=>y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  const nthMon=(m,n)=>{const f=new Date(y,m-1,1).getDay();return 1+((8-f)%7)+(n-1)*7};
  [[1,1],[2,11],[2,23],[4,29],[5,3],[5,4],[5,5],[8,11],[11,3],[11,23]].forEach(([m,d])=>s.add(p(m,d)));
  s.add(p(1,nthMon(1,2)));s.add(p(7,nthMon(7,3)));s.add(p(9,nthMon(9,3)));s.add(p(10,nthMon(10,2)));
  const q=Math.floor((y-1980)/4);s.add(p(3,Math.floor(20.8431+0.242194*(y-1980)-q)));s.add(p(9,Math.floor(23.2488+0.242194*(y-1980)-q)));
  for(const h of[...s].sort()){const d=new Date(h);if(d.getDay()===0){do d.setDate(d.getDate()+1);while(s.has(fmtD(d)));s.add(fmtD(d))}}
  for(let d=new Date(y,0,2);d.getFullYear()===y;d.setDate(d.getDate()+1)){const a=new Date(d),b=new Date(d);a.setDate(a.getDate()-1);b.setDate(b.getDate()+1);if(d.getDay()!==0&&!s.has(fmtD(d))&&s.has(fmtD(a))&&s.has(fmtD(b)))s.add(fmtD(d))}
  [p(1,2),p(1,3),p(12,31)].forEach(x=>s.add(x));
  return HOL[y]=s;
}
const closedDay=d=>d.getDay()===0||d.getDay()===6||holidays(d.getFullYear()).has(fmtD(d));
/* 銀行の休みにあたる日：引き落としは次の営業日、給料は前の営業日 */
const bizNext=s=>{const d=new Date(s);while(closedDay(d))d.setDate(d.getDate()+1);return fmtD(d)};
const bizPrev=s=>{const d=new Date(s);while(closedDay(d))d.setDate(d.getDate()-1);return fmtD(d)};
const cardById=v=>v&&v.startsWith('card:')?S.cards.find(c=>'card:'+c.id===v)||null:null;
/* その出費がどのカードか。手で選んだもの → 固定費の設定 → Apple Pay のカード名 の順 */
function cardOf(x){
  if(x.payBy)return cardById(x.payBy);
  if(x.src==='fixed'){const f=S.fixed.find(f=>f.name===x.merchant);return f?cardById(f.payBy):null}
  if(x.src==='applepay'){const s=(x.card||'').toLowerCase();
    return S.cards.find(c=>c.match&&s.includes(c.match.toLowerCase()))||(S.cards.length===1&&!S.cards[0].match?S.cards[0]:null)}
  return null;
}
const cycleKey=(c,date)=>{const k=ym(date);return +date.slice(8)<=Math.min(c.close,daysInMonth(k))?k:addM(k,1)};
const closeDate=(c,k)=>dayIn(k,c.close);
const payDate=(c,k)=>bizNext(dayIn(addM(k,c.payMonth||1),c.payDay));
/* カードごとの請求：status は paid（引き落とし済み）/ fixed（締め後・確定）/ open（いま使っている分）/ future（まだ始まっていない） */
function cardBills(c,ahead=3){
  const t=today(),by={};
  for(const x of S.spend){if(cardOf(x)!==c)continue;const k=cycleKey(c,x.date);(by[k]=by[k]||{amount:0,n:0});by[k].amount+=x.amount;by[k].n++}
  const openK=cycleKey(c,t),keys=new Set(Object.keys(by).filter(k=>payDate(c,k)>=addM(curYM(),-2)+'-01'));
  for(let i=0;i<=ahead;i++)keys.add(addM(openK,i));
  const done=Object.keys(by).filter(k=>k<openK).sort().slice(-3),avg=done.length?Math.round(done.reduce((a,k)=>a+by[k].amount,0)/done.length):0;
  /* まだ記録されていない、このカード払いの固定費（これからの分） */
  const sched={};for(const f of S.fixed){if(f.payBy!=='card:'+c.id)continue;
    for(let k=f.last?nextYM(f.last):curYM(),i=0;i<=ahead+1;i++,k=nextYM(k)){const d=dayIn(k,f.day);if(d<=t)continue;const ck=cycleKey(c,d);sched[ck]=(sched[ck]||0)+f.amount}}
  return [...keys].sort().map(k=>{
    const b=by[k]||{amount:0,n:0},cd=closeDate(c,k),pd=payDate(c,k);
    const status=pd<t?'paid':cd<t?'fixed':k===openK?'open':'future';
    let est=b.amount;
    if(status==='open'){const st=new Date(closeDate(c,addM(k,-1)));st.setDate(st.getDate()+1);
      const frac=(new Date(t)-st)/864e5/((new Date(cd)-st)/864e5+1);est=Math.max(b.amount,frac>.25?Math.round(b.amount/Math.max(frac,.01)):avg)}
    if(status==='future')est=Math.max(b.amount,avg);
    const fx=sched[k]||0;
    /* 平均にはふだんの固定費も入っているので、平均を使った月は固定費を重ねて足さない */
    if(fx&&(status==='open'||status==='future'))est=Math.max(est,b.amount+fx);
    const ov=(S.billFix||{})[c.id+'|'+k];
    return {key:k,card:c,closeD:cd,payD:pd,amount:b.amount,n:b.n,status,est,fx,ov:ov==null?null:ov};
  });
}
/* カード会社のアプリの請求額を入れたらそれを使う（ネットでの買い物など Apple Pay に出ない分も入るため） */
const billAmt=b=>b.ov!=null?b.ov:b.status==='paid'||b.status==='fixed'?b.amount:b.est;
const upcomingBills=()=>S.cards.flatMap(c=>cardBills(c)).filter(b=>b.payD>=today()&&billAmt(b)>0).sort((a,b)=>a.payD.localeCompare(b.payD));

/* ---------- 口座残高の見込み：カードの引き落とし・給料・先取り・口座払いの固定費 ---------- */
function projection(days=92){
  const t=today(),end=(()=>{const d=new Date(t);d.setDate(d.getDate()+days);return fmtD(d)})();
  const acs=S.accounts.filter(a=>a.bal!=null),since=a=>a.at||t,ev=[];
  const push=(acct,date,amount,label,kind)=>{const a=acs.find(x=>x.id===acct);if(!a||date<=since(a)||date>end||!amount)return;ev.push({acct,date,amount,label,kind})};
  const months=[];for(let k=addM(ym(acs.reduce((m,a)=>since(a)<m?since(a):m,t)),0);k<=ym(end);k=addM(k,1))months.push(k);
  for(const c of S.cards)for(const b of cardBills(c,4))push(c.acct,b.payD,-billAmt(b),`💳 ${c.name}（${+b.key.slice(5)}月締め${b.status==='fixed'||b.status==='paid'?'・確定':'・見込み'}）`,'card');
  if(S.salary&&S.salary.amount&&S.payday)for(const k of months)push(S.salary.acct,bizPrev(dayIn(k,S.payday)),S.salary.amount,'💴 給料','pay');
  if(S.salary&&S.salary.bonus)for(const m of String(S.salary.bonusDays||'').matchAll(/(\d{1,2})\s*[\/月]\s*(\d{1,2})/g))
    for(const k of months)if(+k.slice(5)===+m[1])push(S.salary.acct,bizPrev(dayIn(k,+m[2])),S.salary.bonus,'🎁 ボーナス','pay');
  if(S.pre&&S.pre.amount)for(const k of months){const d=dayIn(k,S.pre.day);
    if(S.pre.way==='invest')push(S.pre.from,d,-S.pre.amount,'📈 積立（証券口座へ）','pre');
    else{push(S.pre.from,d,-S.pre.amount,'🐷 先取り貯金（出す）','pre');push(S.pre.to,d,S.pre.amount,'🐷 先取り貯金（入る）','pre')}}
  for(const f of S.fixed)if(f.payBy&&f.payBy.startsWith('acct:'))for(const k of months)push(f.payBy.slice(5),dayIn(k,f.day),-f.amount,'🏠 '+f.name,'fixed');
  ev.sort((a,b)=>a.date.localeCompare(b.date)||a.amount-b.amount);
  const bal=Object.fromEntries(acs.map(a=>[a.id,a.bal])),mins={};
  const nowB={...bal};for(const e of ev)if(e.date<=t)nowB[e.acct]+=e.amount;
  for(const e of ev){bal[e.acct]+=e.amount;e.after=bal[e.acct];if(e.date>t&&(!mins[e.acct]||e.after<mins[e.acct].v))mins[e.acct]={v:e.after,d:e.date}}
  const series=[];const run={...nowB};let i=0;const fut=ev.filter(e=>e.date>t);
  for(let d=new Date(t);fmtD(d)<=end;d.setDate(d.getDate()+1)){const s=fmtD(d);while(i<fut.length&&fut[i].date<=s){run[fut[i].acct]+=fut[i].amount;i++}series.push({d:s,v:Object.values(run).reduce((a,b)=>a+b,0)})}
  return {ev:fut,now:nowB,mins,series,end,acs};
}

/* ---------- 見直しポイント：記録した数字をルールで比べて、減らせそうな所を見つける（AI なし） ---------- */
const WD='日月火水木金土';
const varSpend=()=>S.spend.filter(x=>x.src!=='fixed');
/* 減らした分が目標にどう効くか */
function effectLine(save){
  if(!(save>=300))return '';
  const yr=Math.round(save*12),g=activeGoals().filter(g=>current(g)<g.target).sort((a,b)=>(b.deadline?1:0)-(a.deadline?1:0))[0];
  if(!g)return `月 ${yen(save)} 減らすと、年 ${yen(yr)} 貯まります`;
  const rest=g.target-current(g),p=pace();
  if(p>0){const before=rest/p,after=rest/(p+save),m=Math.round(before-after);
    if(m>=1)return `月 ${yen(save)} 減らすと年 ${yen(yr)}。「${esc(g.name)}」に約${m}か月早く届きます`}
  if(yr>=rest)return `月 ${yen(save)} 減らすと年 ${yen(yr)}。「${esc(g.name)}」のあと ${yen(rest)} を${Math.max(1,Math.ceil(rest/save))}か月で埋められます`;
  return `月 ${yen(save)} 減らすと年 ${yen(yr)}（「${esc(g.name)}」のあと ${yen(rest)} の${Math.round(yr/rest*100)}%）`;
}
function insights(){
  const out=[],t=today(),k=curYM(),d=+t.slice(8),dim=daysInMonth(k),scale=dim/Math.max(d,1);

    }
  }
  /* 2. 小さな出費の積み重ね（1,000円以下・直近30日） */
  const s30=(()=>{const x=new Date(t);x.setDate(x.getDate()-30);return fmtD(x)})(),small=V.filter(x=>x.amount<=1000&&x.date>s30);
  if(small.length>=5){const sum=small.reduce((a,x)=>a+x.amount,0),by={};small.forEach(x=>{by[x.cat]=by[x.cat]||{n:0,v:0};by[x.cat].n++;by[x.cat].v+=x.amount});
    const top=Object.entries(by).sort((a,b)=>b[1].v-a[1].v)[0];
    add({icon:'🪙',title:`1,000円以下の出費 30日で${small.length}回・${yen(sum)} → 年に約${short(sum*12)}円`,detail:`いちばん多いのは${top[0]}（${top[1].n}回・${yen(top[1].v)}）。回数を半分にすると`,save:Math.round(sum/2),score:sum/2,kind:'small'})}
  /* 3. 毎月の支払い（サブスクなど、見つけたもの）の見直し */
  const rc=recurring().filter(r=>r.auto||r.cat==='サブスク');
  if(rc.length){const m=rc.reduce((a,r)=>a+r.amount,0),cheap=rc.reduce((a,r)=>r.amount<a.amount?r:a);
    add({icon:'🔁',title:`サブスクなど毎月の支払い ${rc.length}件・月 ${yen(m)}（年 ${short(m*12)}円）`,detail:`最近使っていないものはありませんか？ ${rc.slice(0,5).map(r=>`${esc(r.name)} 年${short(r.amount*12)}円`).join('・')}`,
      save:cheap.amount,saveNote:`たとえば「${esc(cheap.name)}」をやめると`,score:m*.3,kind:'subs'})}
  /* 4. 「ムダだった」の傾向（直近90日） */
  const since=(()=>{const x=new Date(t);x.setDate(x.getDate()-90);return fmtD(x)})();
  const bad=V.filter(x=>x.feel==='bad'&&x.date>=since);
  if(bad.length>=3){const sum=bad.reduce((a,x)=>a+x.amount,0),cnt=(f)=>{const o={};bad.forEach(x=>{const key=f(x);if(key!=null)o[key]=(o[key]||0)+x.amount});return Object.entries(o).sort((a,b)=>b[1]-a[1])[0]};
    const c=cnt(x=>x.cat),w=cnt(x=>WD[new Date(x.date).getDay()]+'曜'),h=cnt(x=>x.time?(+x.time.slice(0,2)>=22||+x.time.slice(0,2)<5?'深夜':+x.time.slice(0,2)>=17?'夜':+x.time.slice(0,2)>=11?'昼':'朝'):null),m=cnt(x=>x.merchant);

    const s30b=(()=>{const x=new Date(t);x.setDate(x.getDate()-30);return fmtD(x)})(),left=dim-d;

  if(timed.length>=10){const night=timed.filter(x=>+x.time.slice(0,2)>=22||+x.time.slice(0,2)<5),nv=night.reduce((a,x)=>a+x.amount,0),tv=timed.reduce((a,x)=>a+x.amount,0);
    if(night.length/timed.length>=.2)add({icon:'🌙',title:`夜10時以降の出費が ${Math.round(night.length/timed.length*100)}%（60日で${night.length}回・${yen(nv)}）`,detail:'夜はつい使いがち。寝る前はアプリを閉じる、コンビニに寄らない道で帰る、など',save:Math.round(nv/2/2),score:nv/4,kind:'time'})}
  if(R.length>=10){const days={};R.forEach(x=>days[x.date]=(days[x.date]||0)+x.amount);
    let we=0,wd=0;for(let x=new Date(s60);fmtD(x)<t;x.setDate(x.getDate()+1)){const v=days[fmtD(x)]||0;if(x.getDay()===0||x.getDay()===6)we+=v;else wd+=v}

  /* 7. 一回の大きな出費（その分類のふだんの3倍以上・5,000円以上） */

   <div class="btns"><button type="button" class="btn" data-close>やめる</button><button class="btn pri">コピーして Claude を開く</button></div>
   <details style="margin-top:12px"${S.aiNote?' open':''}><summary class="hint" style="cursor:pointer">Claude の答えを残す（次の相談に要点が入ります）</summary>
    <textarea id="an" rows="4" placeholder="Claude の答えを貼り付け">${esc(S.aiNote?.text||'')}</textarea>
    ${S.aiNote?`<p class="hint">前回保存：${md(S.aiNote.date)}</p>`:''}
    <div class="btns"><button type="button" class="btn" data-savenote>答えを保存</button></div></details></form>`);
  const f=$('#af'),aq=$('#aq'),ap=$('#ap');
  const upd=()=>ap.textContent=summaryText(aq.value.trim());upd();
  aq.addEventListener('input',upd);
  f.addEventListener('click',e=>{
    if(e.target.closest('[data-savenote]')){const v=$('#an').value.trim();S.aiNote=v?{date:today(),text:v}:null;save();upd();toast(v?'答えを保存しました':'消しました');return}
    const t=e.target.closest('[data-ask]');if(!t)return;aq.value=ASK[+t.dataset.ask][1];upd();
    f.querySelectorAll('[data-ask]').forEach(b=>b.setAttribute('aria-pressed',b===t))});
  f.addEventListener('submit',async e=>{e.preventDefault();const s=summaryText(aq.value.trim());
    try{await navigator.clipboard.writeText(s)}catch(_){ap.parentElement.open=true;toast('内容を長押しでコピーしてください');return}
    closeSheet();toast('コピーしました。Claude に貼り付けてください');
    setTimeout(()=>{location.href='https://claude.ai/new'},600);
  });
}

/* ---------- 操作 ---------- */
let tt;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2400)}

document.querySelector('nav.tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;view={tab:b.dataset.tab,goal:null,month:null};render()});
$('#fab').addEventListener('click',()=>view.tab==='spend'?spendSheet():txSheet(view.goal));
$('#payfile').addEventListener('change',async e=>{
  const file=e.target.files[0];e.target.value='';if(!file)return;
  const r=importPayLog(await file.text());
  const d=new Date();S.payAt=`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;save();
  render();
  if(r.bal.length){bankAllSheet(r.bal);if(r.n)toast(`出費 ${r.n}件を取り込みました`);return}
  toast(r.total?(r.n?`${r.n}件を取り込みました`:'新しい記録はありませんでした'):'記録が見つかりませんでした（ファイルを確認）');
});
$('#csvfile').addEventListener('change',async e=>{
  const file=e.target.files[0];e.target.value='';if(!file)return;
  if(!S.accounts.length){toast('先に口座を作ってください');return}
  try{const d=await readCSV(file);if(!d||!d.rows.length){toast('明細の形がわかりませんでした（日付と金額の列が見つからない）');return}csvSheet(d,file.name)}
  catch(_){toast('読み込めませんでした')}
});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet'||e.target.closest('[data-close]'))closeSheet()});
$('#restorefile').addEventListener('change',async e=>{
  const file=e.target.files[0];e.target.value='';if(!file)return;
  try{const s=JSON.parse(await file.text());if(!Array.isArray(s.goals)||!Array.isArray(s.tx))throw 0;
    if(confirm(`${file.name} から、目標${s.goals.length}件・記録${s.tx.length}件・出費${(s.spend||[]).length}件を戻します。いまのデータは置き換わります。`)){S=fill({v:1,theme:'auto',...s});save();render();toast('戻しました')}}
  catch(_){toast('バックアップのファイルではないようです')}
});
/* 入力に合わせて：シミュレーターを計算し直す、金額にカンマ、給料日を保存 */
$('#app').addEventListener('input',e=>{
  const t=e.target;
  if(t.matches('#bt,[data-bcat],#sim-m,#sim-i,#pa,#wage,#sal,#bon')){const n=t.value.replace(/[^0-9]/g,'');t.value=n?(+n).toLocaleString('ja-JP'):''}
  if(t.id&&t.id.startsWith('sim-')){
    const n=id=>+($('#'+id).value.replace(/[^0-9.]/g,''))||0;
    sim={m:n('sim-m'),i:n('sim-i'),y:Math.round(n('sim-y')),r:n('sim-r')};$('#simout').innerHTML=simOut();
  }
});
$('#app').addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.pchk!=null&&S.pre){S.pre.chk=S.pre.chk||{};S.pre.chk[t.dataset.pchk]=t.checked;save();const n=document.querySelectorAll('#pre [data-pchk]:checked').length,all=document.querySelectorAll('#pre [data-pchk]').length;const h=$('#pre').previousElementSibling.querySelector('small');if(h)h.textContent=`準備 ${n}/${all}`;if(n===all){const nb=newBadges();if(nb.length)celebrate(nb[0][1],'実績をとりました',nb.map(b=>`${b[1]} ${b[2]}：${b[3]}`))}return}
  if(t.id==='bon'||t.id==='bonm'){S.salary={...(S.salary||{acct:$('#salac').value,amount:0}),bonus:+$('#bon').value.replace(/[^0-9]/g,'')||0,bonusDays:$('#bonm').value.trim()};save();toast(S.salary.bonus?`ボーナス ${yen(S.salary.bonus)}（${S.salary.bonusDays}）を見込みに入れます`:'ボーナスを見込みから外しました');return}
  if(t.id==='sal'||t.id==='salac'){S.salary={...(S.salary||{}),amount:+$('#sal').value.replace(/[^0-9]/g,'')||0,acct:$('#salac').value};save();toast(S.salary.amount?`給料 ${yen(S.salary.amount)} を見込みに入れます`:'給料を見込みから外しました');return}
  if(t.id==='wage'){S.wage=+t.value.replace(/[^0-9]/g,'')||0;save();toast(S.wage?`手取りの時給を ${yen(S.wage)} にしました`:'時給換算をやめました');return}
  if(e.target.id==='payday'){S.payday=+e.target.value||null;save();toast(S.payday?`給料日を${S.payday}日にしました`:'給料日をなしにしました')}});
$('#app').addEventListener('click',async e=>{
  const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.dismiss){S.dismiss[d.dismiss]=1;save();render();return}
  if('hide' in d){S.hide=!S.hide;save();render();return}
  if('gaman' in d){gamanSheet();return}
  if('wish' in d){wishSheet();return}
  if(d.card){cardSheet(d.card);return}
  if(d.aiask){aiSheet(+d.aiask);return}
  if(d.billfix){S.billFix=S.billFix||{};const cur=S.billFix[d.billfix];const[cid,k]=d.billfix.split('|');const c=S.cards.find(x=>x.id===cid);
    const v=prompt(`${c?c.name:''} ${+k.slice(5)}月締めの請求額（カード会社のアプリの額。空にすると見込みに戻す）`,cur!=null?cur:'');if(v===null)return;
    const n=v.replace(/[^0-9]/g,'');if(n)S.billFix[d.billfix]=+n;else delete S.billFix[d.billfix];save();render();toast(n?'請求額を入れました':'見込みに戻しました');return}
  if(d.cardname){cardSheet('new',d.cardname);return}
  if(d.wbuy){const w=S.wish.find(x=>x.id===d.wbuy);w.done='bought';save();render();toast('30日待っても欲しかったもの。楽しんでください');return}
  if(d.wskip){const w=S.wish.find(x=>x.id===d.wskip);w.done='skip';save();render();gamanSheet({amount:w.price,memo:w.name});return}
  if('report' in d){reportSheet(d.report||undefined);return}
  if('tabgo' in d){view={tab:d.tabgo,goal:null,month:null};render();return}
  if(d.pway){const f={...preForm(),way:d.pway};if(S.pre){Object.assign(S.pre,f);save()}else preDraft=f;render();$('#pre')?.scrollIntoView({block:'start'});return}
  if('presave' in d){preSave();return}
  if('csvin' in d){$('#csvfile').click();return}
  if('widget' in d){
    try{await navigator.clipboard.write([new ClipboardItem({'text/plain':fetch('widget.js').then(r=>r.blob()).then(b=>new Blob([b],{type:'text/plain'}))})]);toast('スクリプトをコピーしました')}
    catch(_){try{await navigator.clipboard.writeText(await (await fetch('widget.js')).text());toast('スクリプトをコピーしました')}catch(__){window.open('widget.js');toast('開いた画面からコピーしてください')}}
    return}
  if('badges' in d){badgeSheet();return}
  if('addtx' in d){txSheet();return}
  if('addany' in d){S.dismiss['pay:'+curYM()]=1;save();txSheet(null,null,'先取り貯金');return}
  if('backup' in d){backupFile();return}
  if('restore' in d){$('#restorefile').click();return}
  if(d.leftover){txSheet(null,+d.leftover,`${+curYM().slice(5)}月の予算の余り`);return}
  if(d.fixed){fixedSheet(d.fixed);return}
  if(d.bank){bankSheet(d.bank);return}
  if('bankall' in d){bankAllSheet();return}
  if('savebudget' in d){
    const num=v=>+String(v).replace(/[^0-9]/g,'')||0;
    S.budget.total=num($('#bt').value);S.budget.cats={};
    document.querySelectorAll('[data-bcat]').forEach(i=>{const n=num(i.value);if(n)S.budget.cats[i.dataset.bcat]=n});
    save();toast('予算を保存しました');return;
  }
  if(d.open){view.goal=d.open;render()}
  else if('back' in d){view.goal=null;render()}
  else if(d.add)txSheet(d.add);
  else if(d.edit)goalSheet(d.edit);
  else if(d.value)valueSheet(d.value);
  else if('ai' in d)aiSheet();
  else if('pay' in d)$('#payfile').click();
  else if(d.sp)spendSheet(d.sp);
  else if(d.mon){view.month=d.mon;render()}
  else if(d.deltx){const x=S.tx.find(v=>v.id===d.deltx);if(x&&confirm(`${md(x.date)} ${sgn(x.amount)} の記録を削除しますか？`)){S.tx=S.tx.filter(v=>v.id!==d.deltx);save();render()}}
  else if('newgoal' in d)goalSheet();
  else if(d.theme){S.theme=d.theme;save();render()}
  else if('copy' in d){const s=JSON.stringify(S);try{await navigator.clipboard.writeText(s);toast('コピーしました')}catch(_){$('#imp').value=s;$('#imp').select();toast('下の欄からコピーしてください')}}
  else if('csv' in d){
    const rows=[['種類','日付','目標・分類','金額','メモ・お店']]
      .concat(S.tx.map(t=>['貯金',t.date,(S.goals.find(g=>g.id===t.goalId)||{}).name||'',t.amount,t.memo]))
      .concat(S.spend.map(x=>['出費',x.date,x.cat,-x.amount,x.merchant]))
      .sort((a,b)=>a[1].localeCompare(b[1])||a[0].localeCompare(b[0]));
    const csv='﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='kotsukotsu-'+today()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }
  else if('import' in d){
    try{const s=JSON.parse($('#imp').value);if(!Array.isArray(s.goals)||!Array.isArray(s.tx))throw 0;
      if(confirm(`目標${s.goals.length}件・記録${s.tx.length}件・出費${(s.spend||[]).length}件を読み込みます。いまのデータは置き換わります。`)){S=fill({v:1,theme:'auto',...s});save();render();toast('読み込みました')}}
    catch(_){toast('データの形が違います')}
  }
  else if('wipe' in d){if(confirm('すべての目標・記録・出費を消します。元に戻せません。')){S=fill({v:1,goals:[],tx:[],theme:S.theme});save();render()}}
  else if('tabCopy' in d){try{await navigator.clipboard.writeText('\t');toast('タブをコピーしました。テキストの間に貼り付けてください')}catch(_){toast('コピーできませんでした')}}
});

runAuto();
/* 開いたときに取れていた実績（月が変わって予算どおり、など）もお祝い */
{const nb=newBadges();render();if(nb.length)celebrate(nb[0][1],'実績をとりました',nb.map(b=>`${b[1]} ${b[2]}：${b[3]}`))}
$('#cele').addEventListener('click',()=>{$('#cele').hidden=true;$('#cele').innerHTML='';render()});

if(location.hash==='#add')txSheet();
else if(location.hash==='#spend'){view.tab='spend';render();spendSheet()}
if(location.hash)history.replaceState(null,'',location.pathname);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){const n=S.tx.length;runAuto();if(S.tx.length!==n)render()}});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js');
</script>
